esults"]},{"feature":"is_question","label_en":"Is a question","label_cs":"Je otázka","kind":"binary","n":1000,"prevalence":0.189,"lift":2.625,"lift_ci":[-0.978,6.346],"adj_effect":2.899,"adj_ci":[1.347,3.975],"significant":true,"examples":["Why packing advice is usually wrong","Why running shoes advice is usually wrong","Why most budgeting advice falls flat"]},{"feature":"negative_hits","label_en":"Negative framing","label_cs":"Negativní rámování","kind":"binary","n":1000,"prevalence":0.087,"lift":10.71,"lift_ci":[6.382,15.656],"adj_effect":-1.775,"adj_ci":[-2.96,-0.451],"significant":true,"examples":["6 indie releases mistakes that quietly cost you results","12 plant-based dinners mistakes that quietly cost you results","10 speedrunning mistakes that quietly cost you results in a way that works for teams of every size across every industry and every single region of the world"]},{"feature":"open_loop","label_en":"Open loop (colon or ellipsis)","label_cs":"Otevřená smyčka (dvojtečka, tři tečky)","kind":"binary","n":1000,"prevalence":0.122,"lift":-9.113,"lift_ci":[-12.466,-6.071],"adj_effect":-1.492,"adj_ci":[-2.835,-0.419],"significant":true,"examples":["Váš průvodce: domácí káva","Váš průvodce: cestování po Česku","Neuvěřitelný příběh: běžecké boty"]},{"feature":"n_words","label_en":"Length in words","label_cs":"Délka ve slovech","kind":"numeric","n":1000,"prevalence":8.227,"lift":-1.423,"lift_ci":[-2.89,-0.577],"adj_effect":-1.423,"adj_ci":[-2.89,-0.577],"significant":true,"examples":["7 things top performers do differently with meal prep","21 meal prep templates you can copy today","6 indie releases mistakes that quietly cost you results"]},{"feature":"caps_ratio","label_en":"ALL CAPS share","label_cs":"Podíl VELKÝCH PÍSMEN","kind":"numeric","n":1000,"prevalence":0.0069,"lift":-1.259,"lift_ci":[-2.355,-0.398],"adj_effect":-1.259,"adj_ci":[-2.355,-0.398],"significant":true,"examples":["What nobody tells you about CRM","How to start with CRM in a way that works for teams of every size across every industry and every single region of the world","4 CRM mistakes that quietly cost you results"]},{"feature":"avg_word_len","label_en":"Average word length","label_cs":"Průměrná délka slova","kind":"numeric","n":1000,"prevalence":5.3806,"lift":0.969,"lift_ci":[-0.556,2.294],"adj_effect":0.969,"adj_ci":[-0.556,2.294],"significant":false,"examples":["7 things top performers do differently with meal prep","21 meal prep templates you can copy today","6 indie releases mistakes that quietly cost you results"]},{"feature":"social_hits","label_en":"Social currency words","label_cs":"Slova sociální měny","kind":"numeric","n":1000,"prevalence":0.109,"lift":0.689,"lift_ci":[-0.531,1.511],"adj_effect":0.689,"adj_ci":[-0.531,1.511],"significant":false,"examples":["7 things top performers do differently with meal prep","21 things top performers do differently with small apartments","9 things top performers do differently with budget flights"]},{"feature":"positive_hits","label_en":"Positive framing","label_cs":"Pozitivní rámování","kind":"numeric","n":1000,"prevalence":0.121,"lift":-0.463,"lift_ci":[-1.573,0.706],"adj_effect":-0.463,"adj_ci":[-1.573,0.706],"significant":false,"examples":["Pravda o chytré domácnosti tak, aby to fungovalo pro týmy všech velikostí napříč všemi obory a ve všech regionech celého světa","Game settings that people absolutely love","3 tips for better sales forecasting"]},{"feature":"clickbait_hits","label_en":"Clickbait phrases","label_cs":"Clickbaitové fráze","kind":"numeric","n":1000,"prevalence":0.124,"lift":-0.062,"lift_ci":[-1.239,1.177],"adj_effect":-0.062,"adj_ci":[-1.239,1.177],"significant":false,"examples":["Shocking sourdough secrets revealed!!!","You won't believe what happened with indie releases!!!","This one trick changes everything about controllers"]}],"myths":[{"id":"m-dopamine","answer":"myth","ref":"Berridge and Robinson, 1998; Schultz et al., 1997","en":"Dopamine is the brain's pleasure chemical.","cs":"Dopamin je mozková látka slasti.","why_en":"Dopamine is better tied to wanting, anticipation and prediction errors than to enjoyment itself. That is why a good hook creates anticipation and then delivers.","why_cs":"Dopamin souvisí spíš s chtěním, očekáváním a chybou predikce než s požitkem samotným. Proto dobrý hook vytvoří očekávání a pak ho splní."},{"id":"m-peeking","answer":"myth","ref":"Johari et al., 2017","en":"Checking an A/B test every hour and stopping at the first p below 0.05 is fine.","cs":"Kontrolovat A/B test každou hodinu a zastavit ho při první hodnotě p pod 0,05 je v pořádku.","why_en":"Continuous peeking inflates false positives far above the nominal 5 percent. Fix the sample size in advance or use a sequential method.","why_cs":"Neustálé nahlížení nafukuje falešně pozitivní výsledky daleko nad nominálních 5 procent. Určete velikost vzorku předem nebo použijte sekvenční metodu."},{"id":"m-stuffing","answer":"myth","ref":"Aggarwal et al., 2024","en":"Stuffing keywords makes your content more visible to AI answer engines.","cs":"Nacpání klíčových slov zvýší viditelnost obsahu v AI odpovědních enginech.","why_en":"In the GEO benchmark, keyword stuffing did not help, while citations, quotations and statistics did. Caveat: one benchmark and engine setup.","why_cs":"V benchmarku GEO nacpání klíčových slov nepomohlo, zatímco citace, citáty a statistiky ano. Pozor: jde o jeden benchmark a nastavení enginu."},{"id":"m-arousal","answer":"fact","ref":"Berger and Milkman, 2012","en":"High-arousal emotions such as awe or anger make content more likely to be shared than low-arousal sadness.","cs":"Emoce s vysokou intenzitou, jako úžas nebo hněv, zvyšují šanci na sdílení víc než smutek s nízkou intenzitou.","why_en":"Observational data on thousands of articles supports this. It shows association, not proof of cause, and it is no licence to manufacture outrage.","why_cs":"Podporují to observační data z tisíců článků. Ukazuje to souvislost, ne důkaz příčiny, a není to licence vyrábět pobouření."},{"id":"m-points","answer":"myth","ref":"Deci, Koestner and Ryan, 1999","en":"Rewarding people with points always increases their intrinsic motivation.","cs":"Odměňování body vždy zvyšuje vnitřní motivaci.","why_en":"A meta-analysis found that expected tangible rewards can undermine intrinsic motivation. Reward progress and mastery, not mere activity.","why_cs":"Metaanalýza zjistila, že očekávané hmatatelné odměny mohou vnitřní motivaci podkopat. Odměňujte pokrok a mistrovství, ne pouhou aktivitu."},{"id":"m-gamification","answer":"fact","ref":"Sailer and Homner, 2020; Hamari et al., 2014","en":"Gamification tends to give small to medium positive effects, and context matters.","cs":"Gamifikace obvykle přináší malé až střední pozitivní efekty a záleží na kontextu.","why_en":"Reviews and a meta-analysis point that way, mostly in learning settings. It is not magic and it can fail.","why_cs":"Přehledové studie a metaanalýza to naznačují, hlavně ve vzdělávání. Není to kouzlo a může to selhat."},{"id":"m-scaled","answer":"myth","ref":"Google Search Central spam policies","en":"Mass-produced AI articles are safe for SEO as long as they read well.","cs":"Hromadně vyráběné AI články jsou pro SEO bezpečné, pokud se dobře čtou.","why_en":"Mass-produced low-value content can violate spam policy however it is made. Add first-party experience and review every piece.","why_cs":"Hromadně vyráběný obsah s nízkou hodnotou může porušovat spamové zásady bez ohledu na to, jak vznikl. Přidejte vlastní zkušenost a každý kus zkontrolujte."},{"id":"m-loss","answer":"fact","ref":"Kahneman and Tversky, 1979","en":"Losses tend to feel larger than equal gains.","cs":"Ztráty bývají vnímány silněji než stejně velké zisky.","why_en":"This is the core of prospect theory. How strongly it shows up in marketing varies, so test it and never fake scarcity.","why_cs":"To je jádro teorie vyhlídek. Jak silně se projeví v marketingu, se liší, takže to testujte a nikdy nepředstírejte nedostatek."},{"id":"m-curiosity","answer":"fact","ref":"Gruber, Gelman and Ranganath, 2014","en":"Curiosity can improve learning and memory.","cs":"Zvědavost může zlepšit učení a paměť.","why_en":"A lab study linked curiosity states to better memory and activity in reward circuitry. Small lab samples, so treat it as supportive, not final.","why_cs":"Laboratorní studie spojila stavy zvědavosti s lepší pamětí a aktivitou v okruzích odměny. Malé laboratorní vzorky, berte to jako podpůrné, ne konečné."},{"id":"m-rats","answer":"myth","ref":"Ferster and Skinner, 1957","en":"Variable-reward experiments on animals prove that slot-machine mechanics are the best way to market products.","cs":"Pokusy s proměnlivou odměnou na zvířatech dokazují, že mechanika hracích automatů je nejlepší způsob marketingu.","why_en":"Reinforcement schedules were studied in animals. Generalising to marketing is weak, and manipulative mechanics erode trust. Variable rewards belong in learning, with published odds.","why_cs":"Plány posilování se zkoumaly na zvířatech. Zobecnění na marketing je slabé a manipulativní mechaniky ničí důvěru. Proměnlivé odměny patří do učení, s uvedenými šancemi."},{"id":"m-geo-cite","answer":"fact","ref":"Aggarwal et al., 2024","en":"Citing sources, adding quotations from named people and adding statistics can help generative engines surface your content.","cs":"Citace zdrojů, citáty jmenovaných osob a statistiky mohou pomoci generativním enginům zobrazit váš obsah.","why_en":"These were the strongest tactics in the GEO benchmark. Use real, verifiable sources only.","why_cs":"Byly to nejsilnější taktiky v benchmarku GEO. Používejte jen skutečné, ověřitelné zdroje."},{"id":"m-fluency","answer":"fact","ref":"Alter and Oppenheimer, 2009","en":"Text that is easy to process shapes how people judge it.","cs":"To, jak snadno se text zpracovává, ovlivňuje, jak ho lidé hodnotí.","why_en":"Processing fluency influences judgements. Short words and clear structure are not decoration, they are persuasion hygiene.","why_cs":"Plynulost zpracování ovlivňuje soudy. Krátká slova a jasná struktura nejsou ozdoba, ale hygiena přesvědčování."}],"lab":{"scenarios":[{"id":"lab-subject","title_en":"Newsletter subject line","title_cs":"Předmět newsletteru","baseline":0.04,"lift_rel":0.25,"visitors_hint":6000},{"id":"lab-cta","title_en":"Landing page button","title_cs":"Tlačítko na landing page","baseline":0.08,"lift_rel":0.15,"visitors_hint":12000},{"id":"lab-thumb","title_en":"Video thumbnail","title_cs":"Náhled videa","baseline":0.03,"lift_rel":0.4,"visitors_hint":3000}]},"vault":{"tactics":[{"id":"curiosity-gap","name_en":"Curiosity gap","name_cs":"Mezera zvědavosti","summary_en":"Make the reader aware of a specific piece of missing information, then deliver it. Information-gap theory describes curiosity as a feeling of deprivation caused by a gap between what we know and what we want to know.","summary_cs":"Ukažte čtenáři konkrétní informaci, která mu chybí, a pak mu ji doručte. Teorie informační mezery popisuje zvědavost jako pocit nedostatku, který vzniká z rozdílu mezi tím, co víme, a tím, co chceme vědět.","driver":"curiosity","ethics_en":"Keep the promise. A gap the content never closes is clickbait and spends the audience's trust.","ethics_cs":"Slib dodržte. Mezera, kterou obsah nikdy nezaplní, je clickbait a promarňuje důvěru publika.","evidence":{"label":"moderate","grade":"B","n_studies":2,"headline_en":"Moderate evidence: one supporting study graded A or B.","headline_cs":"Střední síla důkazů: podpůrná studie se stupněm A nebo B je jedna.","caveats_en":["Gruber et al. 2014: Small laboratory sample; it shows that curiosity aids learning, not that curiosity gaps in headlines raise clicks.","Loewenstein 1994: A theoretical review, not a test on content or headlines."],"caveats_cs":["Gruber et al. 2014: Malý laboratorní vzorek; studie ukazuje, že zvědavost pomáhá učení, ne že mezery zvědavosti v titulcích zvyšují prokliky.","Loewenstein 1994: Teoretický přehled, nikoli test na obsahu nebo titulcích."]}},{"id":"anticipation-payoff","name_en":"Anticipation and payoff","name_cs":"Očekávání a odměna","summary_en":"Build a short, honest anticipation (a teaser, a countdown, a promised answer) and deliver a payoff that matches it. Looking forward to a reward and receiving it are two distinct moments, and both can be rewarding.","summary_cs":"Vybudujte krátké, poctivé očekávání (upoutávku, odpočet, slíbenou odpověď) a doručte odměnu, která mu odpovídá. Těšit se na odměnu a získat ji jsou dva různé okamžiky a oba mohou být příjemné.","driver":"curiosity","ethics_en":"Do not stretch the wait artificially or hide the payoff behind needless clicks.","ethics_cs":"Čekání neprotahujte uměle a odměnu neschovávejte za zbytečná kliknutí.","evidence":{"label":"moderate","grade":"B","n_studies":2,"headline_en":"Moderate evidence: one supporting study graded A or B.","headline_cs":"Střední síla důkazů: podpůrná studie se stupněm A nebo B je jedna.","caveats_en":["Salimpoor et al. 2011: Small laboratory sample of music listeners; it does not test content marketing.","Schultz et al. 1997: Animal neurophysiology and a computational theory, not a test on human audiences."],"caveats_cs":["Salimpoor et al. 2011: Malý laboratorní vzorek posluchačů hudby; netestuje obsahový marketing.","Schultz et al. 1997: Neurofyziologie zvířat a výpočetní teorie, nikoli test na lidském publiku."]}},{"id":"prediction-error","name_en":"Prediction error (surprise)","name_cs":"Predikční chyba (překvapení)","summary_en":"Something that violates expectations tends to get noticed. In animals, dopamine neurons signal the gap between expected and received reward, the best-known neural account of surprise.","summary_cs":"Co porušuje očekávání, si lidé obvykle všimnou. U zvířat dopaminové neurony signalizují rozdíl mezi očekávanou a získanou odměnou, což je nejznámější neurální vysvětlení překvapení.","driver":"surprise","ethics_en":"Surprise must be honest. Novelty is also what makes false news spread, so never invent the unexpected.","ethics_cs":"Překvapení musí být poctivé. Novost je také to, co šíří falešné zprávy, proto nikdy nevymýšlejte nečekané.","evidence":{"label":"strong","grade":"B","n_studies":3,"headline_en":"Strong evidence: 2 supporting studies graded A or B, none of that grade contradicts them.","headline_cs":"Silné důkazy: podpůrných studií se stupněm A nebo B je 2, žádná stejně kvalitní jim neodporuje.","caveats_en":["Vosoughi et al. 2018: Observational and about false news. Novelty can be abused to spread misinformation; this is not an endorsement of sensationalism.","Berger & Milkman 2012: Associations in observational data from one newspaper; not proof of cause.","Schultz et al. 1997: Animal neurophysiology and a computational theory, not a test on human audiences."],"caveats_cs":["Vosoughi et al. 2018: Pozorovací studie o falešných zprávách. Novost lze zneužít k šíření dezinformací; nejde o doporučení senzacechtivosti.","Berger & Milkman 2012: Souvislosti v pozorovacích datech z jednoho deníku; nejde o důkaz příčiny.","Schultz et al. 1997: Neurofyziologie zvířat a výpočetní teorie, nikoli test na lidském publiku."]}},{"id":"emotional-arousal","name_en":"Emotional arousal","name_cs":"Emoční aktivace","summary_en":"Content that evokes high-arousal emotions such as awe, anger or anxiety is shared more than content that evokes low-arousal emotions such as sadness.","summary_cs":"Obsah, který vyvolává emoce s vysokou aktivací (úžas, hněv, úzkost), se sdílí častěji než obsah vyvolávající emoce s nízkou aktivací, například smutek.","driver":"emotion","ethics_en":"Do not manufacture outrage or fear to win clicks. Unearned emotion erodes trust and can hurt readers.","ethics_cs":"Nevyrábějte pobouření ani strach kvůli prokliku. Nezasloužená emoce podkopává důvěru a může čtenářům ublížit.","evidence":{"label":"strong","grade":"B","n_studies":4,"headline_en":"Strong evidence: 3 supporting studies graded A or B, none of that grade contradicts them.","headline_cs":"Silné důkazy: podpůrných studií se stupněm A nebo B je 3, žádná stejně kvalitní jim neodporuje.","caveats_en":["Kramer et al. 2014: Effects were very small, and the study was ethically controversial because of how consent was obtained.","Tellis et al. 2019: Observational data on video ads, not on articles or posts, and about positive emotions rather than only high-arousal ones.","Brady et al. 2017: Observational Twitter data on contested political topics; associations only, and it concerns moralised content rather than all emotion.","Berger & Milkman 2012: The main evidence is observational data from one newspaper (New York Times) and is correlational."],"caveats_cs":["Kramer et al. 2014: Účinky byly velmi malé a studie byla eticky sporná kvůli způsobu získání souhlasu.","Tellis et al. 2019: Observační data o video reklamách, ne o článcích nebo příspěvcích, a týkají se pozitivních emocí, ne jen emocí s vysokou intenzitou.","Brady et al. 2017: Pozorovací data z Twitteru o sporných politických tématech; jde jen o souvislosti a týká se morálně zabarveného obsahu, ne všech emocí.","Berger & Milkman 2012: Hlavní důkazy tvoří pozorovací data z jednoho deníku (New York Times) a jde o souvislosti."]}},{"id":"negativity-bias","name_en":"Negativity bias","name_cs":"Negativní zkreslení","summary_en":"Negative information tends to weigh more than positive information, but online sharing is not simply a matter of negativity: in one large study positive articles were shared more often, and only high-arousal negative emotions such as anger and anxiety boosted sharing.","summary_cs":"Negativní informace mívají větší váhu než pozitivní, ale sdílení online není jen otázka negativity: v jedné velké studii se pozitivní články sdílely častěji a sdílení podporovaly jen negativní emoce s vysokou aktivací, například hněv a úzkost.","driver":"emotion","ethics_en":"Fear and outrage framing can mislead and harm. Do not exaggerate threats to get attention.","ethics_cs":"Rámování strachem a pobouřením může klamat a škodit. Nepřehánějte hrozby kvůli pozornosti.","evidence":{"label":"limited","grade":"","n_studies":1,"headline_en":"Limited evidence: no supporting study is graded A or B, and the strongest study reports mixed results.","headline_cs":"Omezené důkazy: žádná podpůrná studie nemá stupeň A nebo B a nejsilnější studie uvádí smíšené výsledky.","caveats_en":["Berger & Milkman 2012: The main evidence is observational data from one newspaper (New York Times) and is correlational."],"caveats_cs":["Berger & Milkman 2012: Hlavní důkazy tvoří pozorovací data z jednoho deníku (New York Times) a jde o souvislosti."]}},{"id":"social-currency","name_en":"Social currency","name_cs":"Sociální měna","summary_en":"People share what makes them look interesting or well informed. Remarkable, insider or identity-relevant content gives them something to talk about.","summary_cs":"Lidé sdílejí to, díky čemu působí zajímavě nebo informovaně. Pozoruhodný, zasvěcený nebo identitě blízký obsah jim dává o čem mluvit.","driver":"relevance","ethics_en":"Do not push status anxiety or fear of missing out to drive sharing.","ethics_cs":"Nepodporujte sdílení tlakem na status ani strachem, že něco zmeškáte.","evidence":{"label":"moderate","grade":"B","n_studies":1,"headline_en":"Moderate evidence: one supporting study graded A or B.","headline_cs":"Střední síla důkazů: podpůrná studie se stupněm A nebo B je jedna.","caveats_en":["Berger & Schwartz 2011: Observational data about products, not articles or posts."],"caveats_cs":["Berger & Schwartz 2011: Pozorovací data o produktech, ne o článcích nebo příspěvcích."]}},{"id":"triggers-cues","name_en":"Triggers and cues","name_cs":"Spouštěče a podněty","summary_en":"Tie content to something the audience meets often (a time of day, a place, a routine) so the environment keeps reminding them of it and conversation continues over time.","summary_cs":"Svažte obsah s něčím, s čím se publikum setkává často (denní doba, místo, rutina), aby mu to prostředí průběžně připomínalo a rozhovor o něm pokračoval.","driver":"relevance","ethics_en":"Reminders should serve the user: avoid notification spam.","ethics_cs":"Připomínky mají sloužit uživateli: vyhněte se zahlcování upozorněními.","evidence":{"label":"moderate","grade":"B","n_studies":3,"headline_en":"Moderate evidence: one supporting study graded A or B.","headline_cs":"Střední síla důkazů: podpůrná studie se stupněm A nebo B je jedna.","caveats_en":["Berger & Schwartz 2011: Observational data about products, not articles or posts.","Fogg 2009: A conceptual model, not an experiment.","Eyal 2014: Practitioner framework, not peer reviewed."],"caveats_cs":["Berger & Schwartz 2011: Pozorovací data o produktech, ne o článcích nebo příspěvcích.","Fogg 2009: Koncepční model, nikoli experiment.","Eyal 2014: Praktický rámec, bez recenzního řízení."]}},{"id":"social-proof","name_en":"Social proof","name_cs":"Sociální důkaz","summary_en":"People look to what others do and approve of when they decide. Honest signals such as real counts and real testimonials can increase trust and action.","summary_cs":"Při rozhodování se lidé dívají na to, co dělají a schvalují druzí. Poctivé signály, například skutečné počty a skutečná doporučení, mohou zvýšit důvěru i ochotu jednat.","driver":"relevance","ethics_en":"Use only real numbers and real customers. Fake reviews and inflated counts are deceptive and often illegal.","ethics_cs":"Používejte jen skutečná čísla a skutečné zákazníky. Falešné recenze a nafouknuté počty jsou klamavé a často nezákonné.","evidence":{"label":"moderate","grade":"A","n_studies":3,"headline_en":"Moderate evidence: one supporting study graded A or B. Mixed findings in studies graded A or B: 1.","headline_cs":"Střední síla důkazů: podpůrná studie se stupněm A nebo B je jedna. Smíšené nálezy ve studiích se stupněm A nebo B: 1.","caveats_en":["Goldstein et al. 2008: One setting and one behaviour (towel reuse); the number you show must be true to be ethical.","Salganik et al. 2006: One artificial market; social signals shape outcomes strongly but also make them harder to predict.","Cialdini 2021: A practitioner synthesis, not a single controlled test; effects vary by context."],"caveats_cs":["Goldstein et al. 2008: Jedno prostředí a jedno chování (opakované použití ručníků); uvedený údaj musí odpovídat pravdě.","Salganik et al. 2006: Jeden umělý trh; sociální signály výsledky silně ovlivňují, ale také je činí hůře předvídatelnými.","Cialdini 2021: Praktická syntéza, nikoli jediný kontrolovaný test; účinky se liší podle kontextu."]}},{"id":"practical-value","name_en":"Practical value","name_cs":"Praktická užitečnost","summary_en":"Practically useful content (tips, how-tos, checklists, tools that save time or money) is more likely to be shared.","summary_cs":"Prakticky užitečný obsah (tipy, návody, checklisty, nástroje šetřící čas nebo peníze) se sdílí s větší pravděpodobností.","driver":"utility","ethics_en":"Useful means accurate: do not present guesses as proven advice.","ethics_cs":"Užitečný znamená přesný: odhady nevydávejte za ověřené rady.","evidence":{"label":"moderate","grade":"B","n_studies":2,"headline_en":"Moderate evidence: one supporting study graded A or B. Mixed findings in studies graded A or B: 1.","headline_cs":"Střední síla důkazů: podpůrná studie se stupněm A nebo B je jedna. Smíšené nálezy ve studiích se stupněm A nebo B: 1.","caveats_en":["Berger & Milkman 2012: The main evidence is observational data from one newspaper (New York Times) and is correlational.","Tellis et al. 2019: Concerns video ads. Berger and Milkman found practically useful news articles more viral, so the effect depends on the type of content."],"caveats_cs":["Berger & Milkman 2012: Hlavní důkazy tvoří pozorovací data z jednoho deníku (New York Times) a jde o souvislosti.","Tellis et al. 2019: Týká se video reklam. Berger a Milkman zjistili, že prakticky užitečné zpravodajské články byly virálnější, takže efekt závisí na typu obsahu."]}},{"id":"cognitive-fluency","name_en":"Cognitive fluency","name_cs":"Kognitivní plynulost","summary_en":"Content that is easy to read and process tends to be judged more favourably. Plain words, short sentences and a clear layout lower the effort the reader has to spend.","summary_cs":"Obsah, který se snadno čte a zpracovává, bývá hodnocen příznivěji. Jednoduchá slova, krátké věty a přehledné rozvržení snižují námahu, kterou musí čtenář vynaložit.","driver":"fluency","ethics_en":"Fluency can make weak or false claims feel true. Use it to clarify, not to disguise.","ethics_cs":"Plynulost může způsobit, že slabá nebo nepravdivá tvrzení působí věrohodně. Používejte ji k vysvětlení, ne k zakrytí.","evidence":{"label":"moderate","grade":"B","n_studies":2,"headline_en":"Moderate evidence: one supporting study graded A or B.","headline_cs":"Střední síla důkazů: podpůrná studie se stupněm A nebo B je jedna.","caveats_en":["Oppenheimer 2006: Laboratory studies using short texts; not a test on how real content performs.","Alter & Oppenheimer 2009: A theoretical review; fluency effects depend on context, and easy does not mean true."],"caveats_cs":["Oppenheimer 2006: Laboratorní studie s krátkými texty; netestuje výkon skutečného obsahu.","Alter & Oppenheimer 2009: Teoretický přehled; účinky plynulosti závisejí na kontextu a snadné neznamená pravdivé."]}},{"id":"numbers-specificity","name_en":"Numbers and specificity","name_cs":"Čísla a konkrétnost","summary_en":"Concrete numbers and specific details are commonly advised because they are easier to picture and check than vague wording ('seven steps' rather than 'some tips'). The ledger holds no direct test of this yet.","summary_cs":"Konkrétní čísla a podrobnosti se běžně doporučují, protože se dají snáz představit a ověřit než vágní formulace ('sedm kroků' místo 'pár tipů'). Registr studií zatím neobsahuje žádný přímý test tohoto postupu.","driver":"fluency","ethics_en":"Numbers must be real and sourced. Fake precision is deception.","ethics_cs":"Čísla musí být skutečná a doložená. Falešná přesnost je klam.","evidence":{"label":"none","grade":"","n_studies":0,"headline_en":"No evidence linked yet.","headline_cs":"Zatím žádné propojené důkazy.","caveats_en":[],"caveats_cs":[]}},{"id":"headline-questions","name_en":"Question headlines","name_cs":"Titulky s otázkou","summary_en":"A question in the headline can open an information gap, but only if the content answers it. Whether it wins more clicks depends on audience and topic and should be tested.","summary_cs":"Otázka v titulku může otevřít informační mezeru, ale jen tehdy, když na ni obsah odpoví. Zda získá víc prokliků, závisí na publiku a tématu a mělo by se to otestovat.","driver":"curiosity","ethics_en":"Do not ask a question whose honest answer is no just to bait the click.","ethics_cs":"Nepokládejte otázku, na kterou je poctivá odpověď ne, jen abyste vylákali proklik.","evidence":{"label":"limited","grade":"","n_studies":1,"headline_en":"Limited evidence: only background research is linked, no direct test of this tactic.","headline_cs":"Omezené důkazy: je propojen jen podkladový výzkum, žádný přímý test této taktiky.","caveats_en":["Loewenstein 1994: A theoretical review; it does not test question headlines."],"caveats_cs":["Loewenstein 1994: Teoretický přehled; netestuje titulky s otázkou."]}},{"id":"storytelling","name_en":"Storytelling","name_cs":"Vyprávění příběhu","summary_en":"A story with characters and a clear arc can absorb the reader, and readers who are absorbed tend to adopt the beliefs the story implies.","summary_cs":"Příběh s postavami a jasným obloukem může čtenáře pohltit a pohlcení čtenáři mívají sklon přijmout přesvědčení, která příběh předpokládá.","driver":"emotion","ethics_en":"Stories can persuade without evidence. Do not use invented anecdotes as proof.","ethics_cs":"Příběhy mohou přesvědčovat i bez důkazů. Vymyšlené historky nepoužívejte jako důkaz.","evidence":{"label":"moderate","grade":"B","n_studies":1,"headline_en":"Moderate evidence: one supporting study graded A or B.","headline_cs":"Střední síla důkazů: podpůrná studie se stupněm A nebo B je jedna.","caveats_en":["Green & Brock 2000: Laboratory experiments with short narratives; transportation is a reader state, not a guarantee of any particular storytelling technique."],"caveats_cs":["Green & Brock 2000: Laboratorní experimenty s krátkými příběhy; pohlcení je stav čtenáře, ne záruka žádné konkrétní techniky vyprávění."]}},{"id":"personalization","name_en":"Personalisation","name_cs":"Personalizace","summary_en":"Matching a message to the audience's interests or traits can improve response, but it needs data about the audience and care in using it.","summary_cs":"Přizpůsobení sdělení zájmům nebo rysům publika může zlepšit odezvu, vyžaduje ale data o publiku a opatrnost při jejich použití.","driver":"relevance","ethics_en":"Use only data people knowingly shared, respect consent and privacy law, and do not target vulnerabilities.","ethics_cs":"Používejte jen data, která lidé vědomě poskytli, respektujte souhlas a ochranu soukromí a necilte na zranitelná místa.","evidence":{"label":"moderate","grade":"A","n_studies":1,"headline_en":"Moderate evidence: one supporting study graded A or B.","headline_cs":"Střední síla důkazů: podpůrná studie se stupněm A nebo B je jedna.","caveats_en":["Matz et al. 2017: Needs personal data to infer traits; effects were measured on ad clicks and purchases, and the approach raises privacy and manipulation concerns."],"caveats_cs":["Matz et al. 2017: Odhad osobnostních rysů vyžaduje osobní data; účinky byly měřeny na kliknutích a nákupech a přístup vyvolává obavy o soukromí a manipulaci."]}},{"id":"variable-reward","name_en":"Variable reward","name_cs":"Proměnlivá odměna","summary_en":"Unpredictable (variable-ratio) reward schedules sustain responding in animal experiments. How far this carries over to content and apps is unproven.","summary_cs":"Nepředvídatelné (variabilně poměrové) plány odměn udržují reakce v pokusech na zvířatech. Do jaké míry to platí pro obsah a aplikace, není prokázáno.","driver":"game","ethics_en":"This is the mechanism behind compulsive feeds and slot machines. Never use it to build compulsion; give users control and honest limits.","ethics_cs":"Toto je mechanismus kompulzivních feedů a výherních automatů. Nikdy ho nepoužívejte k vytváření nutkání; dejte uživatelům kontrolu a poctivé limity.","evidence":{"label":"limited","grade":"D","n_studies":3,"headline_en":"Limited evidence: 1 study bears directly on this tactic, none strong enough to carry the claim.","headline_cs":"Omezené důkazy: přímo se této taktiky týká studií 1, žádná nestačí k pevnému závěru.","caveats_en":["Schultz et al. 1997: Animal neurophysiology and a computational theory, not a test on human audiences.","Ferster & Skinner 1957: Animal research; generalising to marketing is weak.","Eyal 2014: Practitioner framework, not peer reviewed."],"caveats_cs":["Schultz et al. 1997: Neurofyziologie zvířat a výpočetní teorie, nikoli test na lidském publiku.","Ferster & Skinner 1957: Výzkum na zvířatech; zobecnění na marketing je slabé.","Eyal 2014: Praktický rámec, bez recenzního řízení."]}},{"id":"streaks-loss-aversion","name_en":"Streaks and loss aversion","name_cs":"Série a averze ke ztrátě","summary_en":"People weigh losses more heavily than equal gains, so a streak that can be lost feels valuable. In prospect theory this is loss aversion; how strongly it applies to streak mechanics is not established.","summary_cs":"Lidé přikládají ztrátám větší váhu než stejně velkým ziskům, a proto série, o kterou lze přijít, působí cenně. V teorii vyhlídek se tomu říká averze ke ztrátě; jak silně platí u sérií, není prokázáno.","driver":"game","ethics_en":"Streaks that punish rest or guilt-trip users harm wellbeing. Offer freezes and forgiveness.","ethics_cs":"Série, které trestají odpočinek nebo vyvolávají pocit viny, škodí pohodě. Nabídněte pauzy a odpuštění.","evidence":{"label":"limited","grade":"C","n_studies":2,"headline_en":"Limited evidence: no supporting study is graded A or B, and the strongest study reports mixed results.","headline_cs":"Omezené důkazy: žádná podpůrná studie nemá stupeň A nebo B a nejsilnější studie uvádí smíšené výsledky.","caveats_en":["Deci et al. 1999: Concerns tangible rewards; streak counters are not tangible rewards, so the link is indirect.","Kahneman & Tversky 1979: A theory built on decision experiments; it does not test streaks, and effects in marketing vary."],"caveats_cs":["Deci et al. 1999: Týká se hmotných odměn; počítadla sérií hmotnou odměnou nejsou, takže souvislost je nepřímá.","Kahneman & Tversky 1979: Teorie opřená o rozhodovací experimenty; netestuje série a účinky v marketingu se liší."]}},{"id":"gamification-points-badges","name_en":"Points, badges and leaderboards","name_cs":"Body, odznaky a žebříčky","summary_en":"Game elements such as points, badges and leaderboards can improve engagement and learning outcomes in some contexts. Effects are typically small to moderate and depend on the context and the users.","summary_cs":"Herní prvky jako body, odznaky a žebříčky mohou v některých kontextech zlepšit zapojení a výsledky učení. Účinky bývají malé až střední a závisejí na kontextu a uživatelích.","driver":"game","ethics_en":"Do not turn points into pressure. Rankings can demotivate many users and should be optional.","ethics_cs":"Z bodů nedělejte tlak. Žebříčky mohou řadu uživatelů odradit a měly by být volitelné.","evidence":{"label":"strong","grade":"A","n_studies":4,"headline_en":"Strong evidence: 2 supporting studies graded A or B, none of that grade contradicts them. Mixed findings in studies graded A or B: 1.","headline_cs":"Silné důkazy: podpůrných studií se stupněm A nebo B je 2, žádná stejně kvalitní jim neodporuje. Smíšené nálezy ve studiích se stupněm A nebo B: 1.","caveats_en":["Sailer & Homner 2020: Concerns learning settings, not marketing content; effects are small to medium.","Hamari et al. 2014: A literature review from 2014; effects depend on context and users.","Deci et al. 1999: Concerns tangible rewards; points and badges are symbolic, so the link is indirect.","Deterding et al. 2011: A definition and conceptual paper, not evidence of an effect."],"caveats_cs":["Sailer & Homner 2020: Týká se výuky, ne marketingového obsahu; účinky jsou malé až střední.","Hamari et al. 2014: Přehled literatury z roku 2014; účinky závisejí na kontextu a uživatelích.","Deci et al. 1999: Týká se hmotných odměn; body a odznaky jsou symbolické, takže souvislost je nepřímá.","Deterding et al. 2011: Definice a koncepční text, nikoli důkaz účinku."]}},{"id":"intrinsic-vs-extrinsic-motivation","name_en":"Intrinsic vs extrinsic motivation","name_cs":"Vnitřní a vnější motivace","summary_en":"Expected, tangible rewards tend to undermine intrinsic motivation (the overjustification effect). Design rewards that support the value of the activity itself instead of replacing it.","summary_cs":"Očekávané hmotné odměny mívají tendenci oslabovat vnitřní motivaci (efekt nadměrného zdůvodnění). Navrhujte odměny, které podporují vlastní hodnotu činnosti, místo aby ji nahrazovaly.","driver":"game","ethics_en":"Avoid reward schemes that crowd out genuine interest.","ethics_cs":"Vyhněte se systémům odměn, které vytlačují skutečný zájem.","evidence":{"label":"moderate","grade":"A","n_studies":2,"headline_en":"Moderate evidence: one supporting study graded A or B. Mixed findings in studies graded A or B: 1.","headline_cs":"Střední síla důkazů: podpůrná studie se stupněm A nebo B je jedna. Smíšené nálezy ve studiích se stupněm A nebo B: 1.","caveats_en":["Deci et al. 1999: The effect concerns tangible, expected rewards; other kinds of rewards behave differently.","Sailer & Homner 2020: Learning settings, not content marketing; it shows that extrinsic elements do not always backfire."],"caveats_cs":["Deci et al. 1999: Účinek se týká očekávaných hmotných odměn; jiné druhy odměn působí jinak.","Sailer & Homner 2020: Výukové kontexty, ne obsahový marketing; ukazuje, že vnější prvky nemusí vždy uškodit."]}},{"id":"scarcity-urgency","name_en":"Scarcity and urgency","name_cs":"Nedostatek a naléhavost","summary_en":"Limited supply or limited time makes an offer feel more valuable and pushes people to act sooner.","summary_cs":"Omezená zásoba nebo omezený čas činí nabídku cennější a pobízí lidi, aby jednali dřív.","driver":"emotion","ethics_en":"Use only truthful scarcity: real stock and real deadlines. Fake countdowns and invented shortages are deceptive and may be illegal.","ethics_cs":"Používejte jen pravdivý nedostatek: skutečné zásoby a skutečné termíny. Falešná odpočítávání a vymyšlené nedostatky jsou klamavé a mohou být nezákonné.","evidence":{"label":"limited","grade":"D","n_studies":1,"headline_en":"Limited evidence: 1 study bears directly on this tactic, none strong enough to carry the claim.","headline_cs":"Omezené důkazy: přímo se této taktiky týká studií 1, žádná nestačí k pevnému závěru.","caveats_en":["Cialdini 2021: A practitioner synthesis, not a single controlled test; effects vary by context."],"caveats_cs":["Cialdini 2021: Praktická syntéza, nikoli jediný kontrolovaný test; účinky se liší podle kontextu."]}},{"id":"dopamine-myth","name_en":"The dopamine myth","name_cs":"Mýtus o dopaminu","summary_en":"Dopamine is not a simple pleasure chemical. It is tied to wanting, anticipation and prediction error, which is why 'dopamine hits' is a misleading way to describe engagement.","summary_cs":"Dopamin není jednoduchá chemická látka potěšení. Souvisí s toužením, očekáváním a predikční chybou, a proto je výraz 'dávky dopaminu' zavádějící popis zapojení.","driver":"integrity","ethics_en":"Do not use neuroscience words to dress up manipulation. Say what the content does, not that it hacks the brain.","ethics_cs":"Neurovědní slova nepoužívejte k ozdobení manipulace. Řekněte, co obsah dělá, ne že hackuje mozek.","evidence":{"label":"moderate","grade":"B","n_studies":4,"headline_en":"Moderate evidence: one supporting study graded A or B.","headline_cs":"Střední síla důkazů: podpůrná studie se stupněm A nebo B je jedna.","caveats_en":["Salimpoor et al. 2011: Small sample of music listeners; dopamine release was measured indirectly with imaging.","Gruber et al. 2014: Small laboratory sample.","Berridge & Robinson 1998: A review that relies largely on animal research; the debate in the field continues.","Schultz et al. 1997: Animal neurophysiology and a computational theory, not a test on human audiences."],"caveats_cs":["Salimpoor et al. 2011: Malý vzorek posluchačů hudby; uvolnění dopaminu bylo měřeno nepřímo zobrazovací metodou.","Gruber et al. 2014: Malý laboratorní vzorek.","Berridge & Robinson 1998: Přehledová studie opírající se z velké části o výzkum na zvířatech; odborná debata pokračuje.","Schultz et al. 1997: Neurofyziologie zvířat a výpočetní teorie, nikoli test na lidském publiku."]}},{"id":"video-hook-first-seconds","name_en":"Video hook in the first seconds","name_cs":"Háček v prvních vteřinách videa","summary_en":"Open a video with its most compelling moment or promise so viewers know within seconds why to stay. The ledger holds no direct test of this yet; measure retention with your own tests.","summary_cs":"Začněte video nejsilnějším momentem nebo příslibem, aby diváci během vteřin věděli, proč zůstat. Registr studií zatím neobsahuje žádný přímý test tohoto postupu; udržení diváků měřte vlastními testy.","driver":"structure","ethics_en":"The hook must be in the video. A hook that misrepresents the content costs trust.","ethics_cs":"Háček musí být ve videu skutečně obsažen. Háček, který zkresluje obsah, stojí důvěru.","evidence":{"label":"none","grade":"","n_studies":0,"headline_en":"No evidence linked yet.","headline_cs":"Zatím žádné propojené důkazy.","caveats_en":[],"caveats_cs":[]}},{"id":"ab-testing-basics","name_en":"A/B testing basics","name_cs":"Základy A/B testování","summary_en":"Randomly split traffic between variants, choose the metric and sample size in advance, and judge the result with the planned statistics. Controlled experiments are the most reliable way to learn what works for your own audience.","summary_cs":"Provoz náhodně rozdělte mezi varianty, metriku a velikost vzorku zvolte předem a výsledek posuzujte plánovanou statistikou. Kontrolované experimenty jsou nejspolehlivější způsob, jak zjistit, co funguje u vašeho publika.","driver":"testing","ethics_en":"Do not run experiments that could harm users, and be open about how data is used.","ethics_cs":"Nespouštějte experimenty, které mohou uživatelům uškodit, a otevřeně říkejte, jak se data používají.","evidence":{"label":"limited","grade":"C","n_studies":3,"headline_en":"Limited evidence: 2 studies bear directly on this tactic, none strong enough to carry the claim.","headline_cs":"Omezené důkazy: přímo se této taktiky týká studií 2, žádná nestačí k pevnému závěru.","caveats_en":["Kramer et al. 2014: Included as an ethics reminder, not as evidence that a tactic works.","Kohavi et al. 2009: A methods guide, not a test of any content tactic.","Kohavi et al. 2020: A methods guide, not a test of any content tactic."],"caveats_cs":["Kramer et al. 2014: Zařazeno jako etická připomínka, nikoli jako důkaz, že nějaká taktika funguje.","Kohavi et al. 2009: Metodický průvodce, netestuje žádnou obsahovou taktiku.","Kohavi et al. 2020: Metodický průvodce, netestuje žádnou obsahovou taktiku."]}},{"id":"ab-testing-peeking","name_en":"Peeking at A/B tests","name_cs":"Nahlížení do A/B testů","summary_en":"Checking a test repeatedly and stopping as soon as it looks significant inflates false positives. Fix the sample size in advance or use sequential methods designed for continuous monitoring.","summary_cs":"Opakované kontrolování testu a zastavení ve chvíli, kdy vypadá významně, zvyšuje počet falešně pozitivních výsledků. Velikost vzorku stanovte předem nebo použijte sekvenční metody určené pro průběžné sledování.","driver":"testing","ethics_en":"Do not report a winner you stopped early as a proven result.","ethics_cs":"Vítěze, kterého jste zastavili předčasně, nevydávejte za prokázaný výsledek.","evidence":{"label":"limited","grade":"C","n_studies":1,"headline_en":"Limited evidence: 1 study bears directly on this tactic, none strong enough to carry the claim.","headline_cs":"Omezené důkazy: přímo se této taktiky týká studií 1, žádná nestačí k pevnému závěru.","caveats_en":["Johari et al. 2017: A statistical result that follows from the mathematics of repeated testing, not an empirical study of content."],"caveats_cs":["Johari et al. 2017: Statistický výsledek vyplývající z matematiky opakovaného testování, nikoli empirická studie obsahu."]}},{"id":"geo-cite-sources","name_en":"GEO: cite sources","name_cs":"GEO: odkazy na zdroje","summary_en":"Citing credible sources in your content improved its visibility in generative engine answers in one benchmark.","summary_cs":"Odkazy na důvěryhodné zdroje v obsahu zlepšily v jednom srovnávacím testu jeho viditelnost v odpovědích generativních vyhledávačů.","driver":"geo","ethics_en":"Cite only sources you have read and that say what you claim.","ethics_cs":"Odkazujte jen na zdroje, které jste přečetli a které říkají to, co tvrdíte.","evidence":{"label":"moderate","grade":"B","n_studies":1,"headline_en":"Moderate evidence: one supporting study graded A or B.","headline_cs":"Střední síla důkazů: podpůrná studie se stupněm A nebo B je jedna.","caveats_en":["Aggarwal et al. 2024: Results come from one benchmark and engine setup; they are not a guarantee for commercial engines."],"caveats_cs":["Aggarwal et al. 2024: Výsledky pocházejí z jednoho srovnávacího testu a nastavení vyhledávače; nejsou zárukou pro komerční vyhledávače."]}},{"id":"geo-statistics","name_en":"GEO: add statistics","name_cs":"GEO: přidání statistik","summary_en":"Adding relevant statistics improved visibility in generative engine answers in one benchmark.","summary_cs":"Přidání relevantních statistik zlepšilo v jednom srovnávacím testu viditelnost v odpovědích generativních vyhledávačů.","driver":"geo","ethics_en":"Use only real, sourced numbers. Invented statistics are fabrication, and generative engines may repeat them.","ethics_cs":"Používejte jen skutečná čísla s uvedeným zdrojem. Vymyšlené statistiky jsou fabulace a generativní vyhledávače je mohou opakovat.","evidence":{"label":"moderate","grade":"B","n_studies":1,"headline_en":"Moderate evidence: one supporting study graded A or B.","headline_cs":"Střední síla důkazů: podpůrná studie se stupněm A nebo B je jedna.","caveats_en":["Aggarwal et al. 2024: Results come from one benchmark and engine setup; they are not a guarantee for commercial engines."],"caveats_cs":["Aggarwal et al. 2024: Výsledky pocházejí z jednoho srovnávacího testu a nastavení vyhledávače; nejsou zárukou pro komerční vyhledávače."]}},{"id":"geo-quotations","name_en":"GEO: add quotations","name_cs":"GEO: citáty","summary_en":"Adding quotations from credible people or documents improved visibility in generative engine answers in one benchmark.","summary_cs":"Přidání citátů důvěryhodných osob nebo dokumentů zlepšilo v jednom srovnávacím testu viditelnost v odpovědích generativních vyhledávačů.","driver":"geo","ethics_en":"Quote accurately and with permission where needed. Never invent a quote or attribute words to someone who did not say them.","ethics_cs":"Citujte přesně a tam, kde je třeba, se souhlasem. Citáty nikdy nevymýšlejte a nepřipisujte slova někomu, kdo je neřekl.","evidence":{"label":"moderate","grade":"B","n_studies":1,"headline_en":"Moderate evidence: one supporting study graded A or B.","headline_cs":"Střední síla důkazů: podpůrná studie se stupněm A nebo B je jedna.","caveats_en":["Aggarwal et al. 2024: Results come from one benchmark and engine setup; they are not a guarantee for commercial engines."],"caveats_cs":["Aggarwal et al. 2024: Výsledky pocházejí z jednoho srovnávacího testu a nastavení vyhledávače; nejsou zárukou pro komerční vyhledávače."]}},{"id":"geo-keyword-stuffing","name_en":"GEO: keyword stuffing (does not help)","name_cs":"GEO: nacpávání klíčových slov (nepomáhá)","summary_en":"Repeating keywords did not help visibility in generative engine answers in one benchmark. Write for the reader and the question instead.","summary_cs":"Opakování klíčových slov v jednom srovnávacím testu nepomohlo viditelnosti v odpovědích generativních vyhledávačů. Pište raději pro čtenáře a jeho otázku.","driver":"geo","ethics_en":"Keyword stuffing can also breach search spam policies.","ethics_cs":"Nacpávání klíčových slov může také porušovat spamové zásady vyhledávačů.","evidence":{"label":"moderate","grade":"B","n_studies":1,"headline_en":"Moderate evidence: one supporting study graded A or B.","headline_cs":"Střední síla důkazů: podpůrná studie se stupněm A nebo B je jedna.","caveats_en":["Aggarwal et al. 2024: Results come from one benchmark and engine setup; they are not a guarantee for commercial engines."],"caveats_cs":["Aggarwal et al. 2024: Výsledky pocházejí z jednoho srovnávacího testu a nastavení vyhledávače; nejsou zárukou pro komerční vyhledávače."]}},{"id":"answer-first-structure","name_en":"Answer-first structure","name_cs":"Struktura s odpovědí na začátku","summary_en":"Put the direct answer in the first lines, then explain, so both readers and answer engines find it immediately. The ledger holds no direct test of this yet.","summary_cs":"Přímou odpověď dejte hned na začátek a teprve potom vysvětlujte, aby ji čtenáři i generativní vyhledávače našli okamžitě. Registr studií zatím neobsahuje žádný přímý test tohoto postupu.","driver":"structure","ethics_en":"","ethics_cs":"","evidence":{"label":"none","grade":"","n_studies":0,"headline_en":"No evidence linked yet.","headline_cs":"Zatím žádné propojené důkazy.","caveats_en":[],"caveats_cs":[]}},{"id":"eeat-experience","name_en":"E-E-A-T and first-hand experience","name_cs":"E-E-A-T a vlastní zkušenost","summary_en":"Show first-hand experience, expertise, authority and trustworthiness: who wrote it, what they actually did, and how claims can be checked. Google describes this as guidance on content quality.","summary_cs":"Ukažte vlastní zkušenost, odbornost, autoritu a důvěryhodnost: kdo text napsal, co skutečně dělal a jak lze tvrzení ověřit. Google to popisuje jako vodítko kvality obsahu.","driver":"integrity","ethics_en":"Never fake credentials, reviews or hands-on experience.","ethics_cs":"Nikdy nepředstírejte kvalifikaci, recenze ani vlastní zkušenost.","evidence":{"label":"limited","grade":"D","n_studies":1,"headline_en":"Limited evidence: 1 study bears directly on this tactic, none strong enough to carry the claim.","headline_cs":"Omezené důkazy: přímo se této taktiky týká studií 1, žádná nestačí k pevnému závěru.","caveats_en":["Creating helpful, reliable, people-first (n.d.): Search engine guidance, not a controlled study; it states intent, not a measured effect."],"caveats_cs":["Creating helpful, reliable, people-first (n.d.): Pokyny vyhledávače, nikoli kontrolovaná studie; vyjadřují záměr, ne změřený účinek."]}},{"id":"scaled-content-abuse","name_en":"Scaled content abuse","name_cs":"Zneužití hromadné tvorby obsahu","summary_en":"Producing many low-value pages mainly to rank, however they are made (including with AI), can violate search spam policies.","summary_cs":"Hromadná tvorba mnoha stránek s nízkou hodnotou hlavně kvůli pořadí ve vyhledávání, ať už vznikají jakkoli (včetně umělé inteligence), může porušovat spamové zásady vyhledávačů.","driver":"integrity","ethics_en":"Scale only what is useful to people. Mass-produced filler wastes readers' time and risks penalties.","ethics_cs":"Škálujte jen to, co lidem pomáhá. Hromadně vyráběná výplň plýtvá časem čtenářů a hrozí za ni postihy.","evidence":{"label":"limited","grade":"D","n_studies":1,"headline_en":"Limited evidence: 1 study bears directly on this tactic, none strong enough to carry the claim.","headline_cs":"Omezené důkazy: přímo se této taktiky týká studií 1, žádná nestačí k pevnému závěru.","caveats_en":["Spam policies for Google web search (n.d.): A search engine policy, not a scientific study; it says what is treated as spam, not an effect size."],"caveats_cs":["Spam policies for Google web search (n.d.): Zásady vyhledávače, nikoli vědecká studie; říkají, co se považuje za spam, nikoli velikost účinku."]}}],"studies":[{"id":"doi:10.1509/jmr.10.0353","title":"What Makes Online Content Viral?","authors":["Berger, J.","Milkman, K. L."],"year":2012,"venue":"Journal of Marketing Research","doi":"10.1509/jmr.10.0353","url":"https://doi.org/10.1509/jmr.10.0353","abstract":null,"cited_by":null,"design":"observational","source":"seed","verified":true,"verification_note":"Confirmed by web search on 2026-10-01: title, authors, venue, year and DOI match public records (publisher or indexing pages).","retracted":false,"peer_reviewed":true,"confidence":"high","grade":"B","grade_score":0.6},{"id":"doi:10.1037/0033-2909.116.1.75","title":"The psychology of curiosity: A review and reinterpretation","authors":["Loewenstein, G."],"year":1994,"venue":"Psychological Bulletin","doi":"10.1037/0033-2909.116.1.75","url":"https://doi.org/10.1037/0033-2909.116.1.75","abstract":null,"cited_by":null,"design":"theory","source":"seed","verified":false,"verification_note":"Bibliographic details confirmed by web search on 2026-10-01; the DOI string itself was not displayed in the sources checked.","retracted":false,"peer_reviewed":true,"confidence":"high","grade":"C","grade_score":0.45},{"id":"doi:10.1126/science.275.5306.1593","title":"A Neural Substrate of Prediction and Reward","authors":["Schultz, W.","Dayan, P.","Montague, P. R."],"year":1997,"venue":"Science","doi":"10.1126/science.275.5306.1593","url":"https://doi.org/10.1126/science.275.5306.1593","abstract":nu í teorie, nikoli test na lidském publiku."},{"tactic_id":"prediction-error","study_id":"doi:10.1126/science.275.5306.1593","direction":"context","note_en":"Reviews evidence that dopamine neurons in primates signal errors in the prediction of future rewards.","note_cs":"Shrnuje důkazy, že dopaminové neurony primátů signalizují chyby v predikci budoucích odměn.","caveat_en":"Animal neurophysiology and a computational theory, not a test on human audiences.","caveat_cs":"Neurofyziologie zvířat a výpočetní teorie, nikoli test na lidském publiku."},{"tactic_id":"prediction-error","study_id":"doi:10.1509/jmr.10.0353","direction":"supports","note_en":"Surprising, interesting and practically useful content were each positively linked to virality.","note_cs":"Překvapivý, zajímavý i prakticky užitečný obsah byl vždy pozitivně spojen s virálností.","caveat_en":"Associations in observational data from one newspaper; not proof of cause.","caveat_cs":"Souvislosti v pozorovacích datech z jednoho deníku; nejde o důkaz příčiny."},{"tactic_id":"prediction-error","study_id":"doi:10.1126/science.aap9559","direction":"supports","note_en":"False news spread farther and faster than true news on Twitter; novelty and emotional reactions were associated with that spread.","note_cs":"Falešné zprávy se na Twitteru šířily dál a rychleji než pravdivé; se šířením souvisely novost a emoční reakce.","caveat_en":"Observational and about false news. Novelty can be abused to spread misinformation; this is not an endorsement of sensationalism.","caveat_cs":"Pozorovací studie o falešných zprávách. Novost lze zneužít k šíření dezinformací; nejde o doporučení senzacechtivosti."},{"tactic_id":"emotional-arousal","study_id":"doi:10.1509/jmr.10.0353","direction":"supports","note_en":"In about 7,000 New York Times articles, content evoking high-arousal emotions (awe, anger, anxiety) was more likely to go viral, while content evoking low-arousal sadness was less likely to.","note_cs":"V přibližně 7 000 článcích New York Times se obsah vyvolávající emoce s vysokou aktivací (úžas, hněv, úzkost) šířil častěji, zatímco obsah vyvolávající smutek s nízkou aktivací méně často.","caveat_en":"The main evidence is observational data from one newspaper (New York Times) and is correlational.","caveat_cs":"Hlavní důkazy tvoří pozorovací data z jednoho deníku (New York Times) a jde o souvislosti."},{"tactic_id":"emotional-arousal","study_id":"doi:10.1073/pnas.1618923114","direction":"supports","note_en":"Moral-emotional language in tweets was associated with more diffusion within ideological groups.","note_cs":"Morálně emoční jazyk v tweetech souvisel s větším šířením uvnitř ideologických skupin.","caveat_en":"Observational Twitter data on contested political topics; associations only, and it concerns moralised content rather than all emotion.","caveat_cs":"Pozorovací data z Twitteru o sporných politických tématech; jde jen o souvislosti a týká se morálně zabarveného obsahu, ne všech emocí."},{"tactic_id":"emotional-arousal","study_id":"doi:10.1177/0022242919841034","direction":"supports","note_en":"In a study of online video ads, positive emotions such as amusement, excitement, inspiration and warmth increased sharing.","note_cs":"Ve studii online video reklam zvyšovaly sdílení pozitivní emoce, například pobavení, nadšení, inspirace a vřelost.","caveat_en":"Observational data on video ads, not on articles or posts, and about positive emotions rather than only high-arousal ones.","caveat_cs":"Observační data o video reklamách, ne o článcích nebo příspěvcích, a týkají se pozitivních emocí, ne jen emocí s vysokou intenzitou."},{"tactic_id":"emotional-arousal","study_id":"doi:10.1073/pnas.1320040111","direction":"context","note_en":"Reducing positive or negative posts in people's news feeds shifted the tone of their own posts by a very small but detectable amount.","note_cs":"Omezení pozitivních nebo negativních příspěvků v přehledu novinek posunulo tón vlastních příspěvků lidí o velmi malou, ale zjistitelnou hodnotu.","caveat_en":"Effects were very small, and the study was ethically controversial because of how consent was obtained.","caveat_cs":"Účinky byly velmi malé a studie byla eticky sporná kvůli způsobu získání souhlasu."},{"tactic_id":"negativity-bias","study_id":"doi:10.1509/jmr.10.0353","direction":"mixed","note_en":"Positive content was more likely to be viral overall. Among negative emotions, high-arousal anger and anxiety increased sharing while low-arousal sadness decreased it.","note_cs":"Pozitivní obsah se celkově šířil častěji. Z negativních emocí sdílení zvyšoval hněv a úzkost s vysokou aktivací, zatímco smutek s nízkou aktivací ho snižoval.","caveat_en":"The main evidence is observational data from one newspaper (New York Times) and is correlational.","caveat_cs":"Hlavní důkazy tvoří pozorovací data z jednoho deníku (New York Times) a jde o souvislosti."},{"tactic_id":"social-currency","study_id":"doi:10.1509/jmkr.48.5.869","direction":"supports","note_en":"Products that were more interesting and more publicly visible generated more immediate word of mouth.","note_cs":"Produkty, které byly zajímavější a veřejně viditelnější, vyvolávaly více okamžitého ústního šíření.","caveat_en":"Observational data about products, not articles or posts.","caveat_cs":"Pozorovací data o produktech, ne o článcích nebo příspěvcích."},{"tactic_id":"triggers-cues","study_id":"doi:10.1509/jmkr.48.5.869","direction":"supports","note_en":"Products that were triggered by frequent cues in the environment received more ongoing word of mouth.","note_cs":"Produkty, které připomínaly časté podněty z prostředí, vyvolávaly více dlouhodobého ústního šíření.","caveat_en":"Observational data about products, not articles or posts.","caveat_cs":"Pozorovací data o produktech, ne o článcích nebo příspěvcích."},{"tactic_id":"triggers-cues","study_id":"doi:10.1145/1541948.1541999","direction":"context","note_en":"The Fogg Behavior Model says a behaviour happens when motivation, ability and a prompt (trigger) come together at the same moment.","note_cs":"Foggův model chování říká, že k chování dojde, když se ve stejném okamžiku sejdou motivace, schopnost a podnět (spouštěč).","caveat_en":"A conceptual model, not an experiment.","caveat_cs":"Koncepční model, nikoli experiment."},{"tactic_id":"triggers-cues","study_id":"seed:eyal-2014","direction":"context","note_en":"Makes an external or internal trigger the first step of its habit-forming Hook model.","note_cs":"Činí vnější nebo vnitřní spouštěč prvním krokem svého modelu tvorby návyků Hook.","caveat_en":"Practitioner framework, not peer reviewed.","caveat_cs":"Praktický rámec, bez recenzního řízení."},{"tactic_id":"social-proof","study_id":"seed:cialdini-2021","direction":"supports","note_en":"Describes social proof, the tendency to follow what others do, as one of several principles of influence, drawing on experimental research.","note_cs":"Popisuje sociální důkaz, tedy sklon řídit se tím, co dělají druzí, jako jeden z několika principů ovlivňování a opírá se o experimentální výzkum.","caveat_en":"A practitioner synthesis, not a single controlled test; effects vary by context.","caveat_cs":"Praktická syntéza, nikoli jediný kontrolovaný test; účinky se liší podle kontextu."},{"tactic_id":"social-proof","study_id":"doi:10.1086/586910","direction":"supports","note_en":"In a field experiment in hotels, a message saying that most guests reuse their towels led to more reuse than a standard environmental appeal.","note_cs":"V terénním experimentu v hotelech vedlo sdělení, že většina hostů používá ručníky opakovaně, k častějšímu opakovanému použití než standardní ekologická výzva.","caveat_en":"One setting and one behaviour (towel reuse); the number you show must be true to be ethical.","caveat_cs":"Jedno prostředí a jedno chování (opakované použití ručníků); uvedený údaj musí odpovídat pravdě."},{"tactic_id":"social-proof","study_id":"doi:10.1126/science.1121066","direction":"mixed","note_en":"In an artificial online music market, showing participants how often songs had been downloaded by others made song popularity more unequal and less predictable.","note_cs":"V umělém online hudebním trhu učinilo zobrazení počtu stažení písní druhými lidmi popularitu písní nerovnější a hůře předvídatelnou.","caveat_en":"One artificial market; social signals shape outcomes strongly but also make them harder to predict.","caveat_cs":"Jeden umělý trh; sociální signály výsledky silně ovlivňují, ale také je činí hůře předvídatelnými."},{"tactic_id":"practical-value","study_id":"doi:10.1509/jmr.10.0353","direction":"supports","note_en":"Practically useful content was positively linked to virality in New York Times articles, alongside surprising and interesting content.","note_cs":"V článcích New York Times byl prakticky užitečný obsah pozitivně spojen s virálností, spolu s překvapivým a zajímavým obsahem.","caveat_en":"The main evidence is observational data from one newspaper (New York Times) and is correlational.","caveat_cs":"Hlavní důkazy tvoří pozorovací data z jednoho deníku (New York Times) a jde o souvislosti."},{"tactic_id":"practical-value","study_id":"doi:10.1177/0022242919841034","direction":"mixed","note_en":"In the same study of video ads, information-focused content tended to reduce sharing, except in risky contexts, so usefulness alone does not make content shareable.","note_cs":"Ve stejné studii video reklam informační obsah sdílení spíš snižoval, kromě rizikových kontextů, takže užitečnost sama sdílení nezaručí.","caveat_en":"Concerns video ads. Berger and Milkman found practically useful news articles more viral, so the effect depends on the type of content.","caveat_cs":"Týká se video reklam. Berger a Milkman zjistili, že prakticky užitečné zpravodajské články byly virálnější, takže efekt závisí na typu obsahu."},{"tactic_id":"cognitive-fluency","study_id":"doi:10.1177/1088868309341564","direction":"supports","note_en":"Reviews research showing that the ease of processing information (processing fluency) shapes judgements of many kinds.","note_cs":"Shrnuje výzkum ukazující, že snadnost zpracování informací (plynulost zpracování) ovlivňuje nejrůznější soudy.","caveat_en":"A theoretical review; fluency effects depend on context, and easy does not mean true.","caveat_cs":"Teoretický přehled; účinky plynulosti závisejí na kontextu a snadné neznamená pravdivé."},{"tactic_id":"cognitive-fluency","study_id":"seed:oppenheimer-2006","direction":"supports","note_en":"Needlessly complex wording lowered readers' ratings of the author's intelligence compared with plain wording.","note_cs":"Zbytečně složité formulace snižovaly hodnocení inteligence autora čtenáři ve srovnání s jednoduchými.","caveat_en":"Laboratory studies using short texts; not a test on how real content performs.","caveat_cs":"Laboratorní studie s krátkými texty; netestuje výkon skutečného obsahu."},{"tactic_id":"headline-questions","study_id":"doi:10.1037/0033-2909.116.1.75","direction":"context","note_en":"The information-gap theory explains why a question can create a felt need for its answer.","note_cs":"Teorie informační mezery vysvětluje, proč může otázka vyvolat pocit potřeby znát odpověď.","caveat_en":"A theoretical review; it does not test question headlines.","caveat_cs":"Teoretický přehled; netestuje titulky s otázkou."},{"tactic_id":"storytelling","study_id":"doi:10.1037/0022-3514.79.5.701","direction":"supports","note_en":"Readers who were more transported into a story held more story-consistent beliefs.","note_cs":"Čtenáři, které příběh více pohltil, měli přesvědčení více v souladu s příběhem.","caveat_en":"Laboratory experiments with short narratives; transportation is a reader state, not a guarantee of any particular storytelling technique.","caveat_cs":"Laboratorní experimenty s krátkými příběhy; pohlcení je stav čtenáře, ne záruka žádné konkrétní techniky vyprávění."},{"tactic_id":"personalization","study_id":"doi:10.1073/pnas.1710966114","direction":"supports","note_en":"In field experiments with ads on Facebook, matching the ad's message to people's personality traits led to more clicks and purchases than mismatched ads.","note_cs":"V terénních experimentech s reklamami na Facebooku vedlo přizpůsobení sdělení osobnostním rysům lidí k většímu počtu kliknutí a nákupů než nepřizpůsobené reklamy.","caveat_en":"Needs personal data to infer traits; effects were measured on ad clicks and purchases, and the approach raises privacy and manipulation concerns.","caveat_cs":"Odhad osobnostních rysů vyžaduje osobní data; účinky byly měřeny na kliknutích a nákupech a přístup vyvolává obavy o soukromí a manipulaci."},{"tactic_id":"variable-reward","study_id":"seed:ferster-skinner-1957","direction":"supports","note_en":"Reports that variable-ratio schedules, where a reward follows an unpredictable number of responses, sustain responding in animals.","note_cs":"Uvádí, že plány s proměnlivým poměrem, kdy odměna přijde po nepředvídatelném počtu reakcí, udržují reakce u zvířat.","caveat_en":"Animal research; generalising to marketing is weak.","caveat_cs":"Výzkum na zvířatech; zobecnění na marketing je slabé."},{"tactic_id":"variable-reward","study_id":"seed:eyal-2014","direction":"context","note_en":"Names a variable reward as one step of its Hook model of habit-forming products.","note_cs":"Uvádí proměnlivou odměnu jako jeden z kroků svého modelu Hook pro produkty vytvářející návyk.","caveat_en":"Practitioner framework, not peer reviewed.","caveat_cs":"Praktický rámec, bez recenzního řízení."},{"tactic_id":"variable-reward","study_id":"doi:10.1126/science.275.5306.1593","direction":"context","note_en":"Reviews evidence that dopamine neurons in primates signal errors in the prediction of future rewards.","note_cs":"Shrnuje důkazy, že dopaminové neurony primátů signalizují chyby v predikci budoucích odměn.","caveat_en":"Animal neurophysiology and a computational theory, not a test on human audiences.","caveat_cs":"Neurofyziologie zvířat a výpočetní teorie, nikoli test na lidském publiku."},{"tactic_id":"streaks-loss-aversion","study_id":"doi:10.2307/1914185","direction":"supports","note_en":"Prospect theory describes loss aversion: losses loom larger than equivalent gains in decisions under risk.","note_cs":"Teorie vyhlídek popisuje averzi ke ztrátě: ztráty mají při rozhodování za rizika větší váhu než stejně velké zisky.","caveat_en":"A theory built on decision experiments; it does not test streaks, and effects in marketing vary.","caveat_cs":"Teorie opřená o rozhodovací experimenty; netestuje série a účinky v marketingu se liší."},{"tactic_id":"streaks-loss-aversion","study_id":"doi:10.1037/0033-2909.125.6.627","direction":"mixed","note_en":"Across experiments, tangible rewards that people expected tended to undermine intrinsic motivation, a risk for reward-based streak mechanics.","note_cs":"V souhrnu experimentů měly očekávané hmotné odměny tendenci oslabovat vnitřní motivaci, což je riziko pro mechaniky sérií založené na odměnách.","caveat_en":"Concerns tangible rewards; streak counters are not tangible rewards, so the link is indirect.","caveat_cs":"Týká se hmotných odměn; počítadla sérií hmotnou odměnou nejsou, takže souvislost je nepřímá."},{"tactic_id":"gamification-points-badges","study_id":"doi:10.1109/hicss.2014.377","direction":"supports","note_en":"A review of empirical studies found mostly positive effects of gamification, but results depended on the context and on the users.","note_cs":"Přehled empirických studií zjistil převážně pozitivní účinky gamifikace, ale výsledky závisely na kontextu a na uživatelích.","caveat_en":"A literature review from 2014; effects depend on context and users.","caveat_cs":"Přehled literatury z roku 2014; účinky závisejí na kontextu a uživatelích."},{"tactic_id":"gamification-points-badges","study_id":"doi:10.1007/s10648-019-09498-w","direction":"supports","note_en":"A meta-analysis found small to medium positive effects of gamification on cognitive, motivational and behavioural learning outcomes.","note_cs":"Metaanalýza zjistila malé až střední pozitivní účinky gamifikace na kognitivní, motivační i behaviorální výsledky učení.","caveat_en":"Concerns learning settings, not marketing content; effects are small to medium.","caveat_cs":"Týká se výuky, ne marketingového obsahu; účinky jsou malé až střední."},{"tactic_id":"gamification-points-badges","study_id":"doi:10.1037/0033-2909.125.6.627","direction":"mixed","note_en":"Tangible rewards that people expected tended to undermine intrinsic motivation across experiments. This warns against rewarding activities that are already enjoyable.","note_cs":"V souhrnu experimentů měly očekávané hmotné odměny tendenci oslabovat vnitřní motivaci. To varuje před odměňováním činností, které už jsou samy o sobě příjemné.","caveat_en":"Concerns tangible rewards; points and badges are symbolic, so the link is indirect.","caveat_cs":"Týká se hmotných odměn; body a odznaky jsou symbolické, takže souvislost je nepřímá."},{"tactic_id":"gamification-points-badges","study_id":"doi:10.1145/2181037.2181040","direction":"context","note_en":"Defines gamification as the use of game design elements in non-game contexts.","note_cs":"Definuje gamifikaci jako použití prvků herního designu v kontextech, které nejsou hrami.","caveat_en":"A definition and conceptual paper, not evidence of an effect.","caveat_cs":"Definice a koncepční text, nikoli důkaz účinku."},{"tactic_id":"intrinsic-vs-extrinsic-motivation","study_id":"doi:10.1037/0033-2909.125.6.627","direction":"supports","note_en":"A meta-analysis of experiments found that tangible rewards people expected tended to undermine intrinsic motivation.","note_cs":"Metaanalýza experimentů zjistila, že očekávané hmotné odměny mají tendenci oslabovat vnitřní motivaci.","caveat_en":"The effect concerns tangible, expected rewards; other kinds of rewards behave differently.","caveat_cs":"Účinek se týká očekávaných hmotných odměn; jiné druhy odměn působí jinak."},{"tactic_id":"intrinsic-vs-extrinsic-motivation","study_id":"doi:10.1007/s10648-019-09498-w","direction":"mixed","note_en":"Gamification, which adds extrinsic game elements, still showed small to medium positive effects on motivational learning outcomes.","note_cs":"Gamifikace, která přidává vnější herní prvky, přesto vykázala malé až střední pozitivní účinky na motivační výsledky učení.","caveat_en":"Learning settings, not content marketing; it shows that extrinsic elements do not always backfire.","caveat_cs":"Výukové kontexty, ne obsahový marketing; ukazuje, že vnější prvky nemusí vždy uškodit."},{"tactic_id":"scarcity-urgency","study_id":"seed:cialdini-2021","direction":"supports","note_en":"Presents scarcity as one of the principles of influence: opportunities seem more valuable when they are less available.","note_cs":"Uvádí nedostatek jako jeden z principů ovlivňování: příležitosti se zdají cennější, když jsou hůře dostupné.","caveat_en":"A practitioner synthesis, not a single controlled test; effects vary by context.","caveat_cs":"Praktická syntéza, nikoli jediný kontrolovaný test; účinky se liší podle kontextu."},{"tactic_id":"dopamine-myth","study_id":"doi:10.1016/s0165-0173(98)00019-8","direction":"supports","note_en":"Argues that dopamine is more about incentive salience (wanting) than about hedonic pleasure (liking).","note_cs":"Zdůvodňuje, že dopamin souvisí spíše s motivační významností (toužením) než s hédonickým potěšením (libostí).","caveat_en":"A review that relies largely on animal research; the debate in the field continues.","caveat_cs":"Přehledová studie opírající se z velké části o výzkum na zvířatech; odborná debata pokračuje."},{"tactic_id":"dopamine-myth","study_id":"doi:10.1038/nn.2726","direction":"supports","note_en":"Dopamine release occurred both while people anticipated a musical peak and while they experienced it, in different parts of the striatum.","note_cs":"K uvolnění dopaminu docházelo jak při očekávání hudebního vrcholu, tak při jeho prožitku, a to v různých částech striata.","caveat_en":"Small sample of music listeners; dopamine release was measured indirectly with imaging.","caveat_cs":"Malý vzorek posluchačů hudby; uvolnění dopaminu bylo měřeno nepřímo zobrazovací metodou."},{"tactic_id":"dopamine-myth","study_id":"doi:10.1126/science.275.5306.1593","direction":"context","note_en":"Reviews evidence that dopamine neurons in primates signal errors in the prediction of future rewards.","note_cs":"Shrnuje důkazy, že dopaminové neurony primátů signalizují chyby v predikci budoucích odměn.","caveat_en":"Animal neurophysiology and a computational theory, not a test on human audiences.","caveat_cs":"Neurofyziologie zvířat a výpočetní teorie, nikoli test na lidském publiku."},{"tactic_id":"dopamine-myth","study_id":"doi:10.1016/j.neuron.2014.08.060","direction":"context","note_en":"States of curiosity engaged the dopaminergic reward circuitry of the brain.","note_cs":"Stavy zvědavosti zapojovaly dopaminový okruh odměny v mozku.","caveat_en":"Small laboratory sample.","caveat_cs":"Malý laboratorní vzorek."},{"tactic_id":"ab-testing-basics","study_id":"doi:10.1007/s10618-008-0114-1","direction":"supports","note_en":"A survey and practical guide to running controlled experiments (A/B tests) on the web.","note_cs":"Přehled a praktický průvodce provozováním kontrolovaných experimentů (A/B testů) na webu.","caveat_en":"A methods guide, not a test of any content tactic.","caveat_cs":"Metodický průvodce, netestuje žádnou obsahovou taktiku."},{"tactic_id":"ab-testing-basics","study_id":"doi:10.1017/9781108653985","direction":"supports","note_en":"A book-length practical guide to designing, running and interpreting online controlled experiments.","note_cs":"Praktický průvodce v rozsahu knihy o plánování, provádění a vyhodnocování online kontrolovaných experimentů.","caveat_en":"A methods guide, not a test of any content tactic.","caveat_cs":"Metodický průvodce, netestuje žádnou obsahovou taktiku."},{"tactic_id":"ab-testing-basics","study_id":"doi:10.1073/pnas.1320040111","direction":"context","note_en":"A very large online experiment on emotional contagion that drew criticism for how consent was handled.","note_cs":"Velmi rozsáhlý online experiment o emočním přenosu, který byl kritizován kvůli způsobu získání souhlasu.","caveat_en":"Included as an ethics reminder, not as evidence that a tactic works.","caveat_cs":"Zařazeno jako etická připomínka, nikoli jako důkaz, že nějaká taktika funguje."},{"tactic_id":"ab-testing-peeking","study_id":"doi:10.1145/3097983.3097992","direction":"supports","note_en":"Shows that continuously monitoring A/B test p-values and stopping when they look significant inflates false positives.","note_cs":"Ukazuje, že průběžné sledování p-hodnot A/B testů a zastavení ve chvíli, kdy vypadají významně, zvyšuje počet falešně pozitivních výsledků.","caveat_en":"A statistical result that follows from the mathematics of repeated testing, not an empirical study of content.","caveat_cs":"Statistický výsledek vyplývající z matematiky opakovaného testování, nikoli empirická studie obsahu."},{"tactic_id":"geo-cite-sources","study_id":"doi:10.1145/3637528.3671900","direction":"supports","note_en":"In the authors' GEO-bench benchmark, adding citations to credible sources improved a page's visibility in generative engine answers.","note_cs":"V srovnávacím testu GEO-bench autorů zlepšilo přidání odkazů na důvěryhodné zdroje viditelnost stránky v odpovědích generativních vyhledávačů.","caveat_en":"Results come from one benchmark and engine setup; they are not a guarantee for commercial engines.","caveat_cs":"Výsledky pocházejí z jednoho srovnávacího testu a nastavení vyhledávače; nejsou zárukou pro komerční vyhledávače."},{"tactic_id":"geo-statistics","study_id":"doi:10.1145/3637528.3671900","direction":"supports","note_en":"In the authors' GEO-bench benchmark, adding statistics improved a page's visibility in generative engin st, autoritativnost a důvěryhodnost (E-E-A-T).","caveat_en":"Search engine guidance, not a controlled study; it states intent, not a measured effect.","caveat_cs":"Pokyny vyhledávače, nikoli kontrolovaná studie; vyjadřují záměr, ne změřený účinek."},{"tactic_id":"scaled-content-abuse","study_id":"seed:google-spam-policies","direction":"supports","note_en":"Google's spam policies list scaled content abuse: generating many low-value pages mainly to manipulate search rankings can violate them, regardless of how the content is made.","note_cs":"Spamové zásady Googlu uvádějí zneužití hromadné tvorby obsahu: vytváření mnoha stránek s nízkou hodnotou hlavně kvůli manipulaci s pořadím ve vyhledávání může zásady porušovat, bez ohledu na to, jak obsah vzniká.","caveat_en":"A search engine policy, not a scientific study; it says what is treated as spam, not an effect size.","caveat_cs":"Zásady vyhledávače, nikoli vědecká studie; říkají, co se považuje za spam, nikoli velikost účinku."}],"stats":{"studies":32,"links":52,"tactics_linked":27,"by_design":{"book":4,"field-experiment":3,"guideline":2,"lab-experiment":6,"meta-analysis":2,"observational":5,"survey":1,"systematic-review":1,"theory":8},"by_grade":{"A":6,"B":11,"C":9,"D":6},"by_source":{"seed":32},"verified":23,"unverified":9,"retracted":0}},"loot":{"cards":[{"id":"pat-curiosity_hits","kind":"pattern","rarity":"rare","demo":true,"title_en":"Curiosity phrases","title_cs":"Fráze vzbuzující zvědavost","body_en":"In the demo corpus, this signal goes with higher success (+6.1 index points per standard deviation, other features held constant). Demo data: simulated.","body_cs":"V demo korpusu tento signál souvisí s vyšší úspěchem (+6.1 bodu indexu na směrodatnou odchylku, ostatní vlastnosti konstantní). Demo data: simulace."},{"id":"pat-practical_hits","kind":"pattern","rarity":"rare","demo":true,"title_en":"Practical value words","title_cs":"Slova praktického užitku","body_en":"In the demo corpus, this signal goes with higher       session.breakShown = true;
      if (app.shell) app.shell.showBreak(limit);
    }
  }

  // -- boot --------------------------------------------------------------------------------------------------
  function boot() {
    ctx.rng = game.systemRng();
    app.store = DK.store.createStore({ lang: i18n.detectLang(root.navigator && root.navigator.language) });
    var settings = app.store.get().settings;
    applySettings(settings, null);
    icons.mountDefs();

    document.getElementById("dk-skip").addEventListener("click", function (e) {
      e.preventDefault();
      var main = document.getElementById("main");
      main.setAttribute("tabindex", "-1");
      main.focus();
    });
    if (mqLight && mqLight.addEventListener) mqLight.addEventListener("change", function () { updateThemeColor(app.store.get().settings.theme); if (app.shell) app.shell.update(); });
    root.addEventListener("hashchange", renderRoute);
    root.addEventListener("pagehide", flushPlayTime);
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") flushPlayTime(); else session.last = Date.now(); });

    loadBundle().then(function (bundle) {
      app.bundle = bundle;
      ctx.bundle = bundle;
      ctx.store = app.store;
      scoring.setDefaultSpec(bundle.spec);
      app.store.update(function (p) { return game.rollover(p, ctx).profile; }, { silent: true });
      app.shell = DK.ui.shell.mount(ctx);
      document.getElementById("dk-boot").remove();
      renderRoute();
      setInterval(tick, 1000);
      return detectLive();
    }).then(function (health) {
      if (health) {
        app.live.enabled = true;
        app.live.version = health.version || null;
        app.live.writer = health.writer || null;
        app.live.checked = true;
        if (app.shell) app.shell.update();
        if (app.route && (app.route.name === "forge" || app.route.name === "guru")) renderRoute();
      } else app.live.checked = true;
    }).catch(function (err) {
      var main = document.getElementById("main");
      var file = root.location.protocol === "file:";
      dom.clear(main);
      main.appendChild(dom.h("div.page", null, dom.h("section.card.error-card", { role: "alert" },
        dom.h("h1.page-title", { id: "view-title", tabindex: "-1" }, i18n.t("app.loadFailed")),
        dom.h("p", null, String(err && err.message ? err.message : err)),
        file ? null : dom.h("p.small", null, i18n.t("app.devHint") + " "), file ? null : dom.h("pre.code", null, "python3 -m http.server -d web 8000"),
        dom.h("button.btn.btn-primary", { type: "button", onclick: function () { root.location.reload(); } }, i18n.t("app.retry")))));
      if (root.console) root.console.error(err);
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})(typeof self !== "undefined" ? self : this);

</script>
