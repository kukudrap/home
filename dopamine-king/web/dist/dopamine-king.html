/* Dopamine King: styles.
 * Dark by default; a polished light theme follows prefers-color-scheme or the toggle (data-theme).
 * Colours are custom properties. The light set is declared twice on purpose: once for the OS
 * preference (unless dark was chosen) and once for an explicit data-theme="light".
 * Sections: 1 tokens, 2 base, 3 layout and shell, 4 components, 5 charts, 6 home, 7 arena, 8 boss,
 * 9 lab, 10 vault, 11 forge, 12 guru, 13 about, 14 motion.
 */

/* ---- 1. tokens ---------------------------------------------------------------------------------- */
:root {
  color-scheme: dark;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;

  --bg: #070b16;
  --bg-glow: radial-gradient(900px 480px at 10% -10%, rgba(124, 92, 255, .24), transparent 62%), radial-gradient(760px 420px at 100% -6%, rgba(255, 79, 163, .15), transparent 60%);
  --surface: #0f1629;
  --surface-hi: #131c36;
  --surface-2: #151f3b;
  --surface-3: #1c2850;
  --line: rgba(150, 165, 235, .16);
  --line-2: rgba(150, 165, 235, .30);
  --track: rgba(150, 165, 235, .16);
  --topbar-bg: rgba(7, 11, 22, .84);
  --nav-bg: rgba(10, 15, 30, .94);
  --shadow-1: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 12px 32px -16px rgba(0, 0, 0, .7);
  --scrim: rgba(4, 7, 16, .68);

  --text: #eef1fc;
  --text-2: #bac4e4;
  --text-3: #98a3ca;

  --accent: #8b6cff;
  --accent-2: #ff4fa3;
  --accent-ink: #b8a7ff;
  --pink-ink: #ff8cc4;
  --info: #38d4f0;
  --info-ink: #6fe3f7;
  --ok: #a3e635;
  --ok-ink: #b6f05a;
  --xp: #fbbf24;
  --xp-ink: #fcd34d;
  --risk: #ff5c7c;
  --risk-ink: #ff8da3;
  --warn: #ffb020;
  --warn-ink: #ffc85a;
  --focus: #7dd3fc;

  --grad-brand: linear-gradient(135deg, #8b6cff, #ff4fa3);
  --grad-btn: linear-gradient(135deg, #6d4aff, #d42a85);
  --grad-meter: linear-gradient(90deg, #8b6cff, #ff4fa3);
  --grad-xp: linear-gradient(90deg, #fbbf24, #ff9248);
  --on-accent: #ffffff;
  --glow-brand: 0 0 0 1px rgba(139, 108, 255, .45), 0 10px 36px -10px rgba(139, 108, 255, .65);
  --glow-num: 0 0 22px rgba(139, 108, 255, .55);

  --tint-brand: rgba(139, 108, 255, .16);
  --tint-info: rgba(56, 212, 240, .13);
  --tint-ok: rgba(163, 230, 53, .12);
  --tint-xp: rgba(251, 191, 36, .14);
  --tint-risk: rgba(255, 92, 124, .15);
  --tint-warn: rgba(255, 176, 32, .14);
  --bd-brand: rgba(139, 108, 255, .5);
  --bd-info: rgba(56, 212, 240, .45);
  --bd-ok: rgba(163, 230, 53, .42);
  --bd-xp: rgba(251, 191, 36, .45);
  --bd-risk: rgba(255, 92, 124, .5);
  --bd-warn: rgba(255, 176, 32, .5);

  /* driver and lexicon category colours (also repeated as underline styles and icons) */
  --c-curiosity: #8b6cff;
  --c-surprise: #ff5aa8;
  --c-emotion: #ff9248;
  --c-relevance: #38d4f0;
  --c-utility: #a3e635;
  --c-fluency: #fbbf24;
  --c-risk: #ff5c7c;
  --c-overclaim: #ffb020;
  --c-tone: #9aa7d8;
  --hl-curiosity: rgba(139, 108, 255, .30);
  --hl-surprise: rgba(255, 90, 168, .26);
  --hl-emotion: rgba(255, 146, 72, .28);
  --hl-relevance: rgba(56, 212, 240, .24);
  --hl-utility: rgba(163, 230, 53, .24);
  --hl-risk: rgba(255, 92, 124, .34);

  /* chart series: validated blue and orange pair (CVD safe), plus two more slots */
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #c98500;
  --rc-common: #8b98c2;
  --rc-rare: #38d4f0;
  --rc-epic: #9b82ff;
  --rc-legendary: #fbbf24;
  --grade-a: #2f7a06;
  --grade-b: #1d6fa8;
  --grade-c: #94600a;
  --grade-d: #b0283e;

  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --topbar-h: 64px;
  --navh: 62px;
}

    --series-1: #2a78d6;

    --rc-common: #6a76a0;

  }

/* ---- 2. base ------------------------------------------------------------------------------------ */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-padding-top: calc(var(--topbar-h) + 12px); }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background: var(--bg-glow);
  pointer-events: none;
}
h1, h2, h3, h4, p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent-ink); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
img { max-width: 100%; height: auto; }
pre, code, kbd, samp { font-family: var(--mono); }
.icon { flex: none; }
[hidden] { display: none !important; }
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
.small { font-size: 13.5px; line-height: 1.45; }
.muted { color: var(--text-3); }
.mono, .big-num, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.big-num { font-size: 30px; font-weight: 800; line-height: 1.1; letter-spacing: -.02em; }
.link { color: var(--accent-ink); font-weight: 600; }
.stack > * + * { margin-top: 16px; }
.stack.tight > * + * { margin-top: 10px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 6px; }
.spacer { flex: 1; }
.kbd { display: inline-block; min-width: 24px; padding: 1px 7px; text-align: center; font-size: 12.5px; font-weight: 700; color: var(--text); background: var(--surface-3); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 7px; }
.code { padding: 12px 14px; overflow-x: auto; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); font-size: 13.5px; white-space: pre-wrap; word-break: break-word; }
code.inline { padding: 1px 6px; font-size: .9em; background: var(--surface-3); border: 1px solid var(--line); border-radius: 6px; overflow-wrap: anywhere; }
.skip-link { position: fixed; left: 12px; top: -80px; z-index: 100; padding: 10px 16px; border-radius: 12px; background: var(--surface-3); color: var(--text); font-weight: 700; border: 2px solid var(--focus); transition: top .15s; }
.skip-link:focus { top: 12px; }
.noscript { margin: 24px; padding: 16px; border: 1px solid var(--bd-warn); border-radius: 12px; background: var(--tint-warn); }

/* ---- 3. layout and shell ------------------------------------------------------------------------- */
.app { min-height: 100vh; display: flex; flex-direction: column; }
.main { flex: 1; outline: none; }
.page { width: 100%; max-width: 1120px; margin: 0 auto; padding: 18px 16px calc(var(--navh) + 28px + env(safe-area-inset-bottom)); }
.page > * + * { margin-top: 18px; }
.page-title { font-size: clamp(26px, 5.2vw, 38px); line-height: 1.12; font-weight: 850; letter-spacing: -.025em; outline: none; }
.page-lead { margin-top: 8px; max-width: 70ch; color: var(--text-2); font-size: 16.5px; }
.eyebrow { font-size: 12.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--pink-ink); }
.heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.heading-title { font-size: 20px; font-weight: 800; letter-spacing: -.015em; }
.heading-sub { margin-top: 2px; font-size: 14px; color: var(--text-3); max-width: 62ch; }
h3.sub { font-size: 15px; font-weight: 800; letter-spacing: .01em; margin-bottom: 8px; color: var(--text-2); }
.card-title { font-size: 18px; font-weight: 800; letter-spacing: -.01em; }

.boot { min-height: 60vh; display: grid; place-content: center; justify-items: center; gap: 16px; color: var(--text-2); }
.boot-crown { width: 56px; height: 56px; border-radius: 16px; background: var(--grad-brand); animation: pulse 1.2s ease-in-out infinite; }

.topbar {
  position: sticky; top: 0; z-index: 40;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "brand tools" "status status";
  gap: 8px 12px; align-items: center;
  padding: calc(8px + env(safe-area-inset-top)) 16px 10px;
  background: var(--topbar-bg);
  -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3);
  border-bottom: 1px solid var(--line);
}
.brand { grid-area: brand; display: inline-flex; align-items: center; gap: 9px; min-width: 0; text-decoration: none; color: var(--text); }
.brand-text { font-size: 13px; font-weight: 900; letter-spacing: .16em; white-space: nowrap; background: var(--grad-brand); -webkit-background-clip: text; background-clip: text; color: transparent; }
.logo-mark { flex: none; filter: drop-shadow(0 0 10px rgba(139, 108, 255, .5)); }
.status { grid-area: status; display: flex; align-items: center; gap: 8px; min-width: 0; }
.tools { grid-area: tools; display: flex; align-items: center; gap: 4px; }
.tools .btn-icon { width: 40px; min-height: 40px; }

.level-chip { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 5px 12px 5px 6px; text-align: left; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 999px; transition: border-color .2s, transform .18s var(--spring); }
.level-chip:hover { border-color: var(--bd-brand); }
.level-chip:active { transform: scale(.98); }
.lvl-badge { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; font: 800 15px var(--mono); color: var(--on-accent); background: var(--grad-btn); box-shadow: 0 0 0 2px var(--surface), 0 0 16px rgba(139, 108, 255, .5); }
.lvl-badge.big { width: 52px; height: 52px; font-size: 24px; }
.lvl-body { flex: 1; min-width: 0; display: grid; gap: 4px; }
.lvl-title { font-size: 12.5px; font-weight: 750; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.lvl-xp { flex: none; font: 700 12px var(--mono); color: var(--text-3); }
.xpbar { display: block; height: 6px; border-radius: 99px; background: var(--track); overflow: hidden; }
.xpbar-fill { display: block; height: 100%; width: calc(var(--v, 0) * 100%); border-radius: 99px; background: var(--grad-xp); transition: width .7s var(--ease); }
.streak-chip { flex: none; display: inline-flex; align-items: center; gap: 5px; height: 40px; padding: 0 12px 0 9px; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 999px; }
.streak-n { font: 800 16px var(--mono); color: var(--text); }
.streak-chip.is-out .streak-n { color: var(--text-3); }
.streak-chip .flame { filter: drop-shadow(0 0 8px rgba(255, 138, 76, .55)); }
.streak-chip.is-out .flame { filter: none; color: var(--text-3); }
.freeze { display: inline-flex; align-items: center; gap: 2px; margin-left: 2px; padding-left: 7px; border-left: 1px solid var(--line-2); font: 700 12px var(--mono); color: var(--info-ink); }
.demo-chip { flex: none; cursor: pointer; }
.btn-icon { width: 44px; padding: 0; }
.lang-seg { padding: 3px; border-radius: 12px; }
.lang-seg .seg-btn { min-width: 38px; min-height: 34px; padding: 0 8px; border-radius: 9px; }
.tools .sound-btn, .tools .profile-btn { display: none; }
@media (max-width: 359.98px) { .brand-text { display: none; } }

.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 65; padding-bottom: env(safe-area-inset-bottom); background: var(--nav-bg); border-top: 1px solid var(--line); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.nav-list { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); max-width: 640px; margin: 0 auto; }
.nav-list > li { min-width: 0; position: relative; }
.nav-link { width: 100%; min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 6px 2px; border: 0; background: transparent; color: var(--text-3); text-decoration: none; font-size: 11.5px; font-weight: 700; line-height: 1.1; position: relative; transition: color .15s; }
.nav-link .nav-label { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-link:hover { color: var(--text); }
.nav-link[aria-current] { color: var(--text); }
.nav-link[aria-current]::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; border-radius: 0 0 4px 4px; background: var(--grad-brand); box-shadow: 0 0 12px rgba(255, 79, 163, .6); }
.nav-link[aria-current] svg { color: var(--accent-ink); filter: drop-shadow(0 0 8px rgba(139, 108, 255, .6)); }
.nav-sub { display: none; position: absolute; right: 6px; bottom: calc(100% + 8px); min-width: 190px; padding: 6px; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 16px; box-shadow: 0 20px 50px -12px rgba(0, 0, 0, .6); }
.nav-more-item.is-open .nav-sub { display: block; }
@media (max-width: 899.98px) {
  .nav-sub .nav-link { flex-direction: row; justify-content: flex-start; gap: 12px; padding: 0 14px; min-height: 48px; font-size: 15px; border-radius: 12px; }
  .nav-sub .nav-link[aria-current]::before { display: none; }
  .nav-sub .nav-link[aria-current] { background: var(--tint-brand); }
}

@media (min-width: 900px) {
  .tools .sound-btn, .tools .profile-btn { display: inline-flex; }
  .topbar { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "brand status tools"; gap: 14px; padding: calc(10px + env(safe-area-inset-top)) 24px 10px; }
  .status { justify-content: flex-end; }
  .level-chip { flex: 0 1 300px; }
  .nav { position: sticky; top: var(--topbar-h); z-index: 39; padding: 0 24px; background: var(--topbar-bg); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 0; border-bottom: 1px solid var(--line); }
  .nav-list { display: flex; gap: 4px; max-width: 1120px; padding: 6px 0; }
  .nav-list > li { flex: 0 0 auto; }
  .nav-link { flex-direction: row; gap: 9px; min-height: 42px; padding: 0 16px; font-size: 15px; border-radius: 12px; }
  .nav-link:hover { background: var(--surface-2); }
  .nav-link[aria-current] { background: var(--tint-brand); box-shadow: inset 0 -2px 0 var(--accent-2); }
  .nav-link[aria-current]::before { display: none; }
  .nav-more { display: none; }
  .nav-more-item, .nav-sub { display: contents; position: static; }
  .page { padding: 28px 24px 64px; }
}
@media (min-width: 1100px) { .nav { padding: 0; } .nav-list, .topbar { padding-left: max(24px, calc((100vw - 1120px) / 2)); padding-right: max(24px, calc((100vw - 1120px) / 2)); } .nav-list { max-width: none; } }

/* ---- 4. components -------------------------------------------------------------------------------- */
.card { background: linear-gradient(180deg, var(--surface-hi), var(--surface) 62%); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; box-shadow: var(--shadow-1); min-width: 0; }
.card > * + * { margin-top: 14px; }
.card.flush { padding: 0; overflow: hidden; }
.grid-2 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.grid-3 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 800px) { .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px; border: 1px solid transparent; border-radius: 14px; font-weight: 750; font-size: 15px; line-height: 1.1; text-decoration: none; text-align: center; color: var(--text); background: transparent; transition: transform .2s var(--spring), box-shadow .2s, background .2s, border-color .2s, filter .2s; -webkit-tap-highlight-color: transparent; user-select: none; }
.btn:active { transform: scale(.95); }
.btn svg { flex: none; }
.btn-primary { color: var(--on-accent); background: var(--grad-btn); box-shadow: var(--glow-brand); }
.btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
.btn-primary:active { transform: scale(.95); }
.btn-ghost { border-color: var(--line-2); background: var(--surface-2); }
.btn-ghost:hover { background: var(--surface-3); border-color: var(--bd-brand); }
.btn-danger { color: var(--risk-ink); border-color: var(--bd-risk); background: var(--tint-risk); }
.btn-sm { min-height: 38px; padding: 0 14px; font-size: 14px; border-radius: 12px; }
.btn-lg { min-height: 54px; padding: 0 26px; font-size: 17px; border-radius: 16px; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; box-shadow: none; transform: none; filter: none; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; min-height: 26px; border-radius: 999px; font-size: 12.5px; font-weight: 750; letter-spacing: .01em; line-height: 1.1; white-space: nowrap; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--line-2); }
.chip svg { flex: none; }
.chip.tone-brand { color: var(--accent-ink); background: var(--tint-brand); border-color: var(--bd-brand); }
.chip.tone-info { color: var(--info-ink); background: var(--tint-info); border-color: var(--bd-info); }
.chip.tone-ok { color: var(--ok-ink); background: var(--tint-ok); border-color: var(--bd-ok); }
.chip.tone-xp { color: var(--xp-ink); background: var(--tint-xp); border-color: var(--bd-xp); }
.chip.tone-risk { color: var(--risk-ink); background: var(--tint-risk); border-color: var(--bd-risk); }
.chip.tone-warn { color: var(--warn-ink); background: var(--tint-warn); border-color: var(--bd-warn); }
.chip.tone-muted { color: var(--text-3); }
button.chip { cursor: pointer; font-family: inherit; }
button.chip:hover { filter: brightness(1.15); }

.tabs { position: relative; display: flex; gap: 6px; padding: 5px; overflow-x: auto; scrollbar-width: none; background: var(--surface-2); border: 1px solid var(--line); border-radius: 16px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 1 0 auto; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px; border: 0; border-radius: 12px; background: transparent; color: var(--text-2); font-weight: 750; font-size: 14.5px; white-space: nowrap; transition: background .2s, color .2s, box-shadow .2s; }
.tab:hover { color: var(--text); background: var(--surface-3); }
.tab.is-active { color: var(--on-accent); background: var(--grad-btn); box-shadow: var(--glow-brand); }
.tabpanel { margin-top: 16px; min-width: 0; }
.tabpanel > * + * { margin-top: 16px; }

.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; }
.seg-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: var(--text-2); font-weight: 700; font-size: 14px; transition: background .2s, color .2s; }
.seg-btn:hover { color: var(--text); background: var(--surface-3); }
.seg-btn[aria-pressed="true"] { color: var(--on-accent); background: var(--grad-btn); }

.switch { display: inline-flex; align-items: center; gap: 12px; min-height: 44px; cursor: pointer; font-weight: 650; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch-ui { position: relative; flex: none; width: 46px; height: 28px; border-radius: 99px; background: var(--track); border: 1px solid var(--line-2); transition: background .2s, border-color .2s; }
.switch-ui::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--text-2); transition: transform .25s var(--spring), background .2s; }
.switch input:checked + .switch-ui { background: var(--grad-btn); border-color: transparent; }
.switch input:checked + .switch-ui::after { transform: translateX(18px); background: #fff; }
.switch input:focus-visible + .switch-ui { outline: 3px solid var(--focus); outline-offset: 2px; }

.field { display: grid; gap: 6px; }
.field-label { font-size: 13.5px; font-weight: 750; color: var(--text-2); }
.field-hint { font-size: 12.5px; color: var(--text-3); }
.input, select.input, textarea.input { width: 100%; min-height: 46px; padding: 10px 13px; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 12px; color: var(--text); font-size: 16px; transition: border-color .2s, box-shadow .2s; }
textarea.input { min-height: 96px; resize: vertical; line-height: 1.5; }
.input::placeholder { color: var(--text-3); opacity: 1; }
.input:hover { border-color: var(--bd-brand); }
.input:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; border-color: transparent; }
select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%), linear-gradient(135deg, var(--text-3) 50%, transparent 50%); background-position: calc(100% - 20px) 55%, calc(100% - 14px) 55%; background-size: 6px 6px, 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
.checks { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.check { display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); font-size: 14.5px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.check:has(input:checked) { border-color: var(--bd-brand); background: var(--tint-brand); }
.check:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
fieldset.fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
fieldset.fieldset legend { padding: 0; margin-bottom: 8px; font-size: 13.5px; font-weight: 750; color: var(--text-2); }
.form-grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 720px) { .form-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); } .form-grid .span-2 { grid-column: 1 / -1; } }
.form-msg { min-height: 1.4em; font-size: 14px; font-weight: 650; }
.form-msg.is-ok { color: var(--ok-ink); }
.form-msg.is-bad { color: var(--risk-ink); }

.slider { display: grid; gap: 8px; }
.slider-label { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: 14px; font-weight: 700; color: var(--text-2); }
.slider-value { font: 800 16px var(--mono); color: var(--text); font-variant-numeric: tabular-nums; }
.slider input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; margin: 0; background: transparent; cursor: pointer; }
.slider input[type="range"]::-webkit-slider-runnable-track { height: 8px; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)) 0 / var(--p, 50%) 100% no-repeat, var(--track); }
.slider input[type="range"]::-moz-range-track { height: 8px; border-radius: 99px; background: var(--track); }
.slider input[type="range"]::-moz-range-progress { height: 8px; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.slider input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -8px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); box-shadow: 0 2px 10px rgba(0, 0, 0, .4); transition: transform .15s var(--spring); }
.slider input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); box-shadow: 0 2px 10px rgba(0, 0, 0, .4); }
.slider input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.15); }
.slider input[type="range"]:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 8px; }
.slider.is-disabled { opacity: .55; }

.empty { display: grid; justify-items: center; gap: 8px; padding: 34px 20px; text-align: center; border: 1px dashed var(--line-2); border-radius: var(--r-lg); background: var(--surface); }
.empty-icon { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 20px; color: var(--accent-ink); background: var(--tint-brand); }
.empty-title { font-size: 18px; font-weight: 800; }
.empty-text { max-width: 52ch; color: var(--text-2); }

.dialog { padding: 0; width: min(560px, calc(100vw - 24px)); max-width: none; max-height: calc(100vh - 24px); color: var(--text); background: var(--surface); border: 1px solid var(--line-2); border-radius: 22px; box-shadow: 0 40px 120px -20px rgba(0, 0, 0, .75); overflow: hidden; }
.dialog.wide { width: min(780px, calc(100vw - 24px)); }
.dialog[open] { display: flex; flex-direction: column; animation: pop-in .28s var(--spring); }
.dialog::backdrop { background: var(--scrim); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 14px 6px 22px; }
.dialog-title { font-size: 20px; font-weight: 850; letter-spacing: -.015em; }
.dialog-body { padding: 8px 22px 22px; overflow: auto; overscroll-behavior: contain; }
.dialog-body > * + * { margin-top: 18px; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 22px; border-top: 1px solid var(--line); background: var(--surface-2); }

.toasts { position: fixed; z-index: 60; left: 12px; right: 12px; bottom: calc(var(--navh) + 14px + env(safe-area-inset-bottom)); display: grid; gap: 8px; justify-items: center; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: flex-start; gap: 10px; width: min(420px, 100%); padding: 9px 8px 9px 11px; background: var(--surface-3); border: 1px solid var(--line-2); border-radius: 16px; box-shadow: 0 18px 50px -14px rgba(0, 0, 0, .7); animation: toast-in .35s var(--spring); }
.toast.is-leaving { opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; }
.toast-icon { flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; background: var(--tint-brand); color: var(--accent-ink); }
.toast.tone-ok .toast-icon { background: var(--tint-ok); color: var(--ok-ink); }
.toast.tone-xp .toast-icon { background: var(--tint-xp); color: var(--xp-ink); }
.toast.tone-info .toast-icon { background: var(--tint-info); color: var(--info-ink); }
.toast.tone-risk .toast-icon { background: var(--tint-risk); color: var(--risk-ink); }
.toast-body { flex: 1; min-width: 0; display: grid; gap: 1px; padding-top: 1px; }
.toast-title { font-weight: 800; font-size: 15px; }
.toast-text { font-size: 13px; line-height: 1.35; color: var(--text-2); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.toast-close { flex: none; width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 10px; background: transparent; color: var(--text-3); }
.toast-close:hover { background: var(--surface-2); color: var(--text); }
@media (min-width: 900px) { .toasts { left: auto; right: 24px; bottom: 24px; justify-items: end; } }

.break-card { position: fixed; z-index: 55; left: 12px; right: 12px; bottom: calc(var(--navh) + 14px + env(safe-area-inset-bottom)); max-width: 480px; display: flex; gap: 14px; padding: 16px; background: var(--surface-2); border: 1px solid var(--bd-info); border-radius: 20px; box-shadow: 0 24px 70px -16px rgba(0, 0, 0, .7), 0 0 0 1px var(--tint-info); animation: toast-in .45s var(--spring); }
.break-icon { flex: none; display: grid; place-items: center; width: 52px; height: 52px; border-radius: 16px; color: var(--info-ink); background: var(--tint-info); }
.break-body > * + * { margin-top: 8px; }
.break-title { font-size: 17px; font-weight: 850; }
@media (min-width: 900px) { .break-card { left: 24px; right: auto; bottom: 24px; } }

.spinner { display: inline-block; width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--track); border-top-color: var(--accent); animation: spin .8s linear infinite; }
.error-card { border-color: var(--bd-risk); }
.table-scroll { position: relative; overflow-x: auto; }
.data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.data-table caption { text-align: left; padding: 4px 0 8px; color: var(--text-3); font-size: 13px; }
.data-table th, .data-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
.data-table thead th { font-size: 12.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-3); }
.data-table td.num, .data-table th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
details > summary { list-style: none; cursor: pointer; }
details > summary::-webkit-details-marker { display: none; }

.profile > * + * { margin-top: 22px; }
.profile-head { display: flex; align-items: center; gap: 14px; }
.profile-level { font-size: 17px; }
.stat-grid { display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 560px) { .stat-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stat-tile { display: grid; gap: 2px; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; }
.stat-val { font: 800 20px var(--mono); font-variant-numeric: tabular-nums; }
.stat-label { font-size: 12.5px; color: var(--text-3); }
.ach-grid { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 560px) { .ach-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.ach { display: flex; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); }
.ach.is-on { border-color: var(--bd-xp); background: var(--tint-xp); }
.ach.is-off { border-style: dashed; }
.ach-icon { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--surface-3); color: var(--text-3); }
.ach.is-on .ach-icon { color: var(--xp-ink); background: var(--tint-xp); }
.ach-text { display: grid; gap: 1px; min-width: 0; font-size: 13.5px; }
.ach-text span { color: var(--text-2); }
.ach-state { font-style: normal; font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--text-3); }
.ach.is-on .ach-state { color: var(--xp-ink); }
.setting { display: grid; gap: 6px; }
.setting-label { font-size: 13.5px; font-weight: 750; color: var(--text-2); }

/* ---- 5. charts and meters -------------------------------------------------------------------------- */
.meter { --h: 12px; width: 100%; min-width: 0; }
.meter.meter-sm { --h: 9px; }
.meter.meter-lg { --h: 18px; }
.meter-track { position: relative; height: var(--h); border-radius: 99px; background: var(--track); }
.meter-fill { position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--v, 0) * 100%); border-radius: 99px; background: var(--fill, var(--grad-meter)); transition: width .9s var(--ease); box-shadow: 0 0 16px -2px var(--glow, transparent); }
.meter.is-empty .meter-fill { width: 0; box-shadow: none; }
.meter-marker { position: absolute; top: -6px; bottom: -6px; left: calc(var(--m, 0) * 100%); width: 3px; margin-left: -1.5px; border-radius: 3px; background: var(--text); box-shadow: 0 0 0 2px var(--surface); transition: left .5s var(--ease); }
.meter-flag { position: absolute; bottom: calc(100% + 3px); left: 50%; transform: translateX(-50%); padding: 1px 7px; border-radius: 6px; font: 800 11.5px var(--font); white-space: nowrap; color: var(--text); background: var(--surface-3); border: 1px solid var(--line-2); }
.meter-flag:empty { display: none; }
.meter.tone-brand { --fill: var(--grad-meter); --glow: rgba(139, 108, 255, .6); }
.meter.tone-ok { --fill: linear-gradient(90deg, #6ec62a, #a3e635); --glow: rgba(163, 230, 53, .5); }
.meter.tone-xp { --fill: var(--grad-xp); --glow: rgba(251, 191, 36, .5); }
.meter.tone-info { --fill: linear-gradient(90deg, #2b8cf0, #38d4f0); --glow: rgba(56, 212, 240, .5); }
.meter.tone-risk { --fill: linear-gradient(90deg, #ff9248, #ff5c7c); --glow: rgba(255, 92, 124, .5); }
.meter.tone-d-curiosity { --fill: var(--c-curiosity); }
.meter.tone-d-surprise { --fill: var(--c-surprise); }
.meter.tone-d-emotion { --fill: var(--c-emotion); }
.meter.tone-d-relevance { --fill: var(--c-relevance); }
.meter.tone-d-utility { --fill: var(--c-utility); }
.meter.tone-d-fluency { --fill: var(--c-fluency); }
:root[data-theme="light"] .meter.tone-ok { --fill: linear-gradient(90deg, #3f8f08, #5aa91a); }
:root[data-theme="light"] .meter.tone-info { --fill: linear-gradient(90deg, #2a78d6, #0a8aa6); }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .meter.tone-ok { --fill: linear-gradient(90deg, #3f8f08, #5aa91a); } :root:not([data-theme="dark"]) .meter.tone-info { --fill: linear-gradient(90deg, #2a78d6, #0a8aa6); } }

.drivers { display: grid; gap: 10px; }
.driver-row { display: grid; grid-template-columns: minmax(104px, 150px) minmax(0, 1fr) 34px; align-items: center; gap: 10px; }
.driver-name { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 700; color: var(--text-2); min-width: 0; }
.driver-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.driver-name svg { flex: none; color: var(--text-3); }
.driver-val { text-align: right; font: 800 14px var(--mono); font-variant-numeric: tabular-nums; }

.split { display: grid; gap: 6px; }
.split-labels { display: flex; justify-content: space-between; gap: 8px; font: 800 14px var(--mono); }
.split-track { display: flex; gap: 3px; height: 14px; }
.split-a, .split-b { width: var(--w, 0%); border-radius: 99px; background: var(--track); transition: width 1s var(--ease); min-width: 0; }
.split-a.is-lead { background: var(--grad-meter); box-shadow: 0 0 14px -2px rgba(139, 108, 255, .6); }
.split-b.is-lead { background: linear-gradient(90deg, #ff4fa3, #ff9248); }
.split-a:not(.is-lead), .split-b:not(.is-lead) { background: var(--line-2); }

.ring { position: relative; flex: none; display: grid; place-items: center; }
.ring svg { position: absolute; inset: 0; }
.ring-track { stroke: var(--track); }
.ring-prog { stroke: url(#dk-g-brand); transition: stroke-dashoffset 1.1s var(--ease); }
.ring.tone-info .ring-prog { stroke: var(--info); }
.ring.tone-ok .ring-prog { stroke: var(--ok); }
.ring-text { position: relative; font: 800 24px var(--mono); font-variant-numeric: tabular-nums; }

.chart { display: grid; gap: 10px; min-width: 0; }
.chart-caption { font-size: 14px; font-weight: 750; color: var(--text-2); }
.chart-stage { position: relative; min-width: 0; border-radius: 12px; }
.chart-stage:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.chart-svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart-svg .grid { stroke: var(--line); stroke-width: 1; }
.chart-svg .axis { stroke: var(--line-2); stroke-width: 1; }
